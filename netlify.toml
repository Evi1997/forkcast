# Netlify: serve the repo as a static site; /api/ai runs as an Edge Function
# (netlify/edge-functions/ai.js, path set in its config export).
[build]
  publish = "."
  command = ""
  # Save credits: each production deploy costs 15 of the free plan's 300/month.
  # Pushes to GitHub only deploy when the commit message contains [deploy];
  # every other push is skipped (exit 0 = skip, 1 = build).
  ignore = "git log -1 --pretty=%B | grep -q '\\[deploy\\]' && exit 1 || exit 0"

# The Supabase URL and publishable key are public by design (they ship to the
# browser in config.js; row-level security protects the data). Skip only these
# two in Netlify's secret scan; GEMINI_API_KEY is still checked.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
