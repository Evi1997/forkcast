  ${overdue ? `<div class="notice accent row" style="justify-content:space-between"><span><b>It's check-in week.</b> A two-minute follow-up so your plan keeps fitting your life.</span><button class="btn primary small" data-act="startcheckin">Check in</button></div>` : ''}
    <section class="card hero fuel" aria-label="Calories and macros">
      <div class="ring">
        <svg viewBox="0 0 176 176"><circle cx="88" cy="88" r="78" fill="none" stroke="var(--hero-track)" stroke-width="16"/>
        <circle cx="88" cy="88" r="78" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset .6s ease"/></svg>
        <div class="center">${t ? `<span class="big">${Math.abs(left).toLocaleString()}</span><span class="label">${left >= 0 ? (isToday ? 'kcal left' : 'kcal under target') : 'kcal above target'}</span><span class="muted num" style="font-size:.8rem;margin-top:6px">${eaten.kcal} / ${kcalT}</span>` : `<span class="big">${eaten.kcal}</span><span class="label">kcal eaten</span>`}</div>
      </div>

        ${bar('Fiber', eaten.fiber, t?.fiber, 'var(--accent)')}

      </div>

  ${S.sheet ? logSheet() : ''}
`;
}

// One short, timely tip instead of a big static card. Picked on the device from
// the time of day, the day of the week and what's been eaten: no AI call.
function smartTip(){
  const t = targets(), items = S.logs[dkey()]?.items || [], eaten = sumItems(items); // tips are always about today
  const now = new Date(), h = now.getHours(), dow = now.getDay(), weekend = dow === 0 || dow === 6 || (dow === 5 && h >= 16);
  const f = S.profile.focus, dayN = Math.floor(now / 864e5);
  const pick = arr => arr[dayN % arr.length];
  const pLeft = t ? t.protein - eaten.protein : 0, kLeft = t ? t.kcal - eaten.kcal : 0;
  if (!t) return null;
  if (t && kLeft < -150) return { title:'A little above today\'s target', text:'Totally fine once in a while. A lighter, veggie-heavy next meal keeps the week balanced.', q:'I went a bit over my calories today. What would be a good light next meal?' };
  if (f && weekend && f.tips?.length) return { title:`Weekend focus: ${f.weak_point}`, text: pick(f.tips), q:`It's the weekend. Help me with my weak point (${f.weak_point}) today.` };
  if (h >= 16 && pLeft > 30) return { title:`${r0(pLeft)} g protein to go`, text:`About ${pLeft > 45 ? 'two palm-sized portions' : 'a palm-sized portion'} of chicken, fish, tofu or Greek yogurt at dinner gets you there.`, q:`I still need about ${r0(pLeft)} g protein today. What could I have?` };
  if (!items.length && h < 11) return { title:'Start with breakfast', text:'Logging as you eat takes seconds; remembering later is harder.', q:'Give me a quick breakfast idea that fits my targets.' };
  if (h >= 14 && t.fiber && eaten.fiber < t.fiber * 0.4) return { title:'Room for more fibre', text:'Beans, lentils, berries, oats or a big side of veg all help, and keep you full.', q:'How can I add more fibre to the rest of today?' };
  if (f?.tips?.length) return { title:`Your focus: ${f.weak_point}`, text: pick(f.tips), q:`Let's talk about my weak point (${f.weak_point}). What else could help?` };
  if (!f && S.profile.onboarded) return { title:'What holds you back most?', text:'Weekends, evenings, eating out… tell your dietitian and the plan will work around it.', q:'I want to talk about what I think holds me back.' };
  return null;
}
function focusCard(){
  const tip = smartTip(); if (!tip) return '';
  return `<button class="tipcard" data-act="askquick" data-q="${esc(tip.q)}" aria-label="${esc(tip.title)}. Talk it through with your dietitian">
    <span class="tip-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span>

// "x/7 days logged" with the week's days as circles (green = logged).
// Tap a circle to open that day; the dark ring marks the day shown.
// The small arrows move a week back or forward.
function streakPill(day){
  const today = dkey(), days = new Set(S.profile.loggedDays || []), mon = fromKey(mondayOf(fromKey(day)));
  const cells = DAYS.map((l, i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return { l, k:dkey(d) }; });
  const week = cells.filter(c => days.has(c.k)).length, thisWeek = cells.some(c => c.k === today);
  const dots = cells.map(c => `<button class="${days.has(c.k) ? 'on' : ''}" data-act="gotoday" data-k="${c.k}" aria-pressed="${c.k === day}" ${c.k > today ? 'disabled' : ''} aria-label="${fromKey(c.k).toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'})}${days.has(c.k) ? ', logged' : ''}">${c.l[0]}</button>`).join('');
  return `<div class="streak" aria-label="${week} of 7 days logged ${thisWeek ? 'this week' : 'that week'}">
    <div><div class="n">${week}<span class="muted" style="font-size:.9rem;font-weight:700">/7</span></div><div class="label" style="font-size:.7rem">days logged</div></div>
    <div class="week-nav"><button class="wk-arrow" data-act="prevweek" aria-label="Previous week">‹</button><div class="week-dots">${dots}</div><button class="wk-arrow" data-act="nextweek" aria-label="Next week" ${thisWeek ? 'disabled' : ''}>›</button></div>
  </div>`;
}

// meals as one-line rows, and the details (portion, swap, recipe) in a sheet.
function vPlan(){
  const head = `<div class="head"><div><div class="label">${S.plan ? `Week of ${fromKey(S.plan.weekOf).toLocaleDateString(undefined,{day:'numeric',month:'long'})}` : 'Seven days, prepped ahead'}</div><h1>Week plan</h1></div>
    <button class="btn ${S.plan ? 'small' : 'primary'}" data-act="genplan" ${S.busy.plan ? 'disabled' : ''}>${S.busy.plan ? `<span class="spinner"></span> ${esc(S.busy.plan)}` : S.plan ? '↻ New week' : 'Plan my week'}</button></div>`;
  const notes = `${statusBanner()}${S.err.plan ? `<div class="notice warn">${esc(S.err.plan)}</div>` : ''}${!S.profile.onboarded && !S.plan ? `<div class="notice accent">Your plan is built from your consultation. Finish it first for a plan that fits your tastes, schedule and supermarket. You can still plan now with what's known.</div>` : ''}`;
  if (!S.plan?.days) return head + notes + `<section class="card empty"><div class="blob" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div><h2>No plan yet</h2><p>Forkcast writes seven days of meals around the food you like, your targets and how often you want to cook, then turns them into one shopping list.</p></section>`;
  const di = Math.min(S.planDay, S.plan.days.length - 1), day = S.plan.days[di], t = targets();
  const tot = day.meals.reduce((a, m) => ({kcal:a.kcal+r0(m.kcal), p:a.p+r0(m.p), c:a.c+r0(m.c), f:a.f+r0(m.f)}), {kcal:0,p:0,c:0,f:0});
  const mon = fromKey(S.plan.weekOf), todayIdx = (new Date().getDay() + 6) % 7, thisWeek = S.plan.weekOf === mondayOf();
  const chevron = '<svg class="tip-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  return head + notes + `
  ${S.plan.grocery?.length ? '' : `<button class="tipcard" data-act="nav" data-v="shop"><span class="tip-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.3 11.2a1 1 0 0 1-1 .8H7.3a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span><span class="tip-txt"><b>Create your shopping list</b><span>One list for the whole week, for your supermarket.</span></span>${chevron}</button>`}
  <div class="daypick" role="tablist" aria-label="Day">${S.plan.days.map((d, i) => { const date = new Date(mon); date.setDate(date.getDate() + i); return `<button class="dp" role="tab" data-act="day" data-i="${i}" aria-selected="${i === di}"><span>${esc(d.day)}</span><b>${date.getDate()}</b>${thisWeek && i === todayIdx ? '<i aria-label="today"></i>' : ''}</button>`; }).join('')}</div>
  <section class="card plan-day">
    <div class="day-sum"><b class="num">${tot.kcal.toLocaleString()} kcal</b>${pfc(tot)}</div>
    ${day.meals.map((m, j) => `<button class="prow" data-act="planmeal" data-i="${di}" data-j="${j}">
      ${SLOTS.includes(m.slot) ? mealIcon(m.slot) : ''}
      <span class="prow-txt"><span class="label">${esc(m.slot)} · ${m.prep === 'fresh' ? 'cook fresh' : 'prepped'}</span><b>${esc(m.name)}</b></span>
      <span class="num">${r0(m.kcal)}</span>${chevron}
    </button>`).join('')}
  </section>
  ${S.plan.notes ? `<details class="plan-notes"><summary>How this week works</summary><p>${esc(S.plan.notes)}</p></details>` : ''}
  ${S.planSheet ? planMealSheet() : ''}`;
}

function planMealSheet(){
  const { i, j } = S.planSheet, m = S.plan.days[i]?.meals[j]; if (!m) return '';
  const key = i + '-' + j, rec = S.plan.recipes?.[key], enter = S.planSheet.enter ? ' enter' : '';
  return `<div class="scrim${enter}" data-act="closeplan"></div>
  <div class="sheet${enter}" role="dialog" aria-modal="true" aria-label="${esc(m.name)}">
    <div class="grip" aria-hidden="true"></div>
    <div class="sheet-head">${SLOTS.includes(m.slot) ? mealIcon(m.slot) : ''}<div style="min-width:0"><div class="label">${esc(S.plan.days[i].day)} · ${esc(m.slot)}</div><h2>${esc(m.name)}</h2></div><button class="x close" data-act="closeplan" aria-label="Close">×</button></div>
    ${dishPhoto(key, m)}
    <div class="review-total"><span class="big num">${r0(m.kcal)}</span><span class="muted">kcal</span><span class="pfc" style="margin-left:auto">${pfc(m)}</span></div>
    <dl class="facts"><dt>Portion</dt><dd>${esc(m.portion)}</dd>${m.swap ? `<dt>Swap</dt><dd>${esc(m.swap)}</dd>` : ''}</dl>
    ${rec ? `<details class="plan-notes" open><summary>Recipe${rec.time ? ' · ' + esc(rec.time) : ''}</summary><div class="recipe-body"><div class="label">Ingredients</div><ul>${(rec.ingredients || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="label">Method</div><ol>${(rec.steps || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>${rec.storage ? `<p class="muted">${esc(rec.storage)}</p>` : ''}</div></details>`
      : `<button class="btn" data-act="recipe" data-k="${key}" data-i="${i}" data-j="${j}" ${S.busy.recipe === key ? 'disabled' : ''}>${S.busy.recipe === key ? '<span class="spinner"></span> Writing the recipe…' : 'Show recipe'}</button>`}
    <div class="sheet-actions"><button class="btn primary big-btn" data-act="logmeal" data-i="${i}" data-j="${j}">I ate this</button></div>
  </div>`;
}

function dishPhoto(key, m){
  const p = S.plan.photos?.[key];
  if (!p) return '';
  return `<figure class="dish"><img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy"><figcaption><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.by)} · Pexels</a></figcaption></figure>`;
}

// Keep the chosen day visible in the day picker after every redraw.
function keepDayInView(){
  const el = document.querySelector('.dp[aria-selected="true"]'); if (!el) return;
  const row = el.parentElement;
  row.scrollLeft = el.offsetLeft - row.offsetLeft - (row.clientWidth - el.offsetWidth) / 2;
}

// === views/shop.js ===
// Shop & prep: the list first (what's left to buy), ticked items fold away,
// supermarket as a small switch, prep plan on its own tab, cost at the bottom.
const CART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.3 11.2a1 1 0 0 1-1 .8H7.3a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';

function vShop(){
  const store = S.plan?.store || (S.plan?.grocery?.length ? storeOptions()[0] : ''), err = S.err.shop ? `<div class="notice warn">${esc(S.err.shop)}</div>` : '';
  const head = (sub) => `<div class="head"><div><div class="label">${sub}</div><h1>Shop & prep</h1></div>
    ${S.plan?.grocery?.length ? `<button class="store-btn" data-act="storesheet" aria-label="Shopping at ${esc(store || 'no supermarket yet')}. Change">${CART}<span><small>Shopping at</small>${esc(store || 'Choose store')}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>` : ''}</div>`;
  if (!S.plan?.days) return head('One trip, one prep session') + `<section class="card empty"><div class="blob" aria-hidden="true">${CART}</div><h2>No list yet</h2><p>Plan your week first. Then Forkcast turns it into one shopping list for your supermarket.</p><button class="btn primary" data-act="nav" data-v="plan">Plan my week</button></section>`;
  if (S.busy.shop) return head('Writing your list') + `<section class="card empty"><div class="blob pulse-blob" aria-hidden="true">${CART}</div><h2>Writing your list…</h2><p>Adding up every ingredient in your week${S.shopStore ? ` for ${esc(S.shopStore)}` : ''}.</p></section>`;
  if (!S.plan.grocery?.length) return head('One trip, one prep session') + err + askForList();

  const tab = S.shopTab || 'list';
  const ch = S.plan.checked || {}, extra = S.plan.extra || [];
  const rows = [
    ...extra.map(x => ({ k:'x-' + x.id, group:'My items', name:x.name, qty:'', note:'', done:!!x.done, mine:true })),
    ...S.plan.grocery.flatMap((g, gi) => (g.items || []).map((it, ii) => ({ k:gi + '-' + ii, group:g.group, name:it.name, qty:it.qty, note:it.note, done:!!ch[gi + '-' + ii] })))
  ];
  const todo = rows.filter(r => !r.done), done = rows.filter(r => r.done);
  const groups = [...new Set(todo.map(r => r.group))];
  const row = r => `<div class="gi ${r.done ? 'done' : ''}"><label><input type="checkbox" data-act="check" data-k="${r.k}" ${r.done ? 'checked' : ''}><span class="gname">${esc(r.name)}</span></label><span class="gq">${esc(r.qty || '')}</span>${r.mine ? `<button class="x small-x" data-act="delextra" data-k="${r.k}" aria-label="Remove ${esc(r.name)}">×</button>` : ''}</div>`;

  return head(`${todo.length ? `${todo.length} to buy` : 'All in the basket'}`) + err + `
  <div class="seg" role="tablist" aria-label="Shop & prep">
    <button role="tab" data-act="shoptab" data-t="list" aria-selected="${tab === 'list'}">List <span class="num">${todo.length}</span></button>
    <button role="tab" data-act="shoptab" data-t="prep" aria-selected="${tab === 'prep'}">Prep plan</button>
  </div>
  ${tab === 'list' ? `
  <section class="card shoplist">
    <div class="basket"><div class="basket-bar"><span style="width:${rows.length ? done.length / rows.length * 100 : 0}%"></span></div><span class="muted num">${done.length}/${rows.length}</span></div>
    <form class="additem" id="addItemForm"><input type="text" id="extraName" placeholder="Add an item, e.g. coffee" aria-label="Add an item" autocomplete="off"><button class="sendbtn" type="submit" aria-label="Add item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></form>
    ${groups.map(g => `<div class="grp"><h3>${esc(g)}</h3>${todo.filter(r => r.group === g).map(row).join('')}</div>`).join('')}
    ${!todo.length ? `<div class="empty" style="padding:18px 0"><h3>All done</h3><p>Everything's in the basket.</p></div>` : ''}
    ${done.length ? `<details class="basket-done"><summary>In the basket · ${done.length}</summary>${done.map(row).join('')}<button class="btn ghost small" data-act="clearchecks">Untick all</button></details>` : ''}
  </section>
  ${S.plan.budget_note ? `<p class="foot-note"><span class="tag est">Estimated</span> ${esc(S.plan.budget_note)} Products and prices for ${esc(store || 'your supermarket')} are estimates, not checked live.</p>` : ''}`
  : prepPlan()}
  ${S.storeSheet ? storeSheet() : ''}`;
}

function prepPlan(){
  const prep = S.plan.prep || [];
  if (!prep.length) return `<section class="card empty"><h2>No prep plan</h2><p>Rebuild your list to get a prep schedule with it.</p></section>`;
  return `<div class="stack">${prep.map(p => `<section class="card prep">
    <div class="row" style="justify-content:space-between"><h2>${esc(p.when)}</h2>${p.minutes ? `<span class="trend-pill">${esc(p.minutes)}</span>` : ''}</div>
    <ol class="steps">${(p.tasks || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>
    ${p.fridge || p.freeze || p.fresh ? `<details class="plan-notes"><summary>Storage</summary><dl class="facts" style="margin-top:8px">${p.fridge ? `<dt>Fridge</dt><dd>${esc(p.fridge)}</dd>` : ''}${p.freeze ? `<dt>Freeze</dt><dd>${esc(p.freeze)}</dd>` : ''}${p.fresh ? `<dt>Fresh</dt><dd>${esc(p.fresh)}</dd>` : ''}</dl></details>` : ''}
  </section>`).join('')}</div>`;
}

// "Shall I create your shopping list?" card, used when there's a plan but no list.
function askForList(){
  return `<section class="card stack ask-list">
    <div class="asker"><span class="ai-avatar" aria-hidden="true">${STAR}</span><div class="bubble">Your week is planned. Shall I create your shopping list?</div></div>
    <div><div class="label" style="margin-bottom:8px">Where are you shopping?</div>${storeChips(S.shopStore || S.plan?.store || storeOptions()[0])}</div>
    <button class="btn primary big-btn" data-act="genshop">Create my shopping list</button>
  </section>`;
}

function storeChips(pick){
  return `<div class="stores" role="group" aria-label="Supermarket">
      ${storeOptions().map(s => `<button class="chip" data-act="store" data-s="${esc(s)}" aria-pressed="${s === pick}">${s === pick ? '✓ ' : ''}${esc(s)}</button>`).join('')}
      <button class="chip" data-act="storeother" aria-pressed="${!!S.storeOther}">Other…</button>
    </div>
    ${S.storeOther ? `<form class="additem" id="storeForm" style="margin-top:8px"><input type="text" id="storeName" placeholder="Supermarket name" aria-label="Supermarket name" autocomplete="off"><button class="btn small" type="submit">Use</button></form>` : ''}`;
}

// Switch supermarket: pick one, then rebuild the list for it.
function storeSheet(){
  const cur = S.plan.store || storeOptions()[0], pick = S.shopStore || cur, enter = S.storeSheet === 'enter' ? ' enter' : '';
  return `<div class="scrim${enter}" data-act="storesheet"></div>
  <div class="sheet${enter}" role="dialog" aria-modal="true" aria-label="Supermarket">
    <div class="grip" aria-hidden="true"></div>
    <div class="sheet-head"><h2>Where are you shopping?</h2><button class="x close" data-act="storesheet" aria-label="Close">×</button></div>
    ${storeChips(pick)}
    <p class="muted" style="font-size:.88rem">Rebuilding uses that store's products and package sizes. Your own items stay; ticks are cleared.</p>
    <div class="sheet-actions"><button class="btn primary big-btn" data-act="genshop" ${pick && pick !== cur ? '' : 'disabled'}>${pick && pick !== cur ? `Rebuild for ${esc(pick)}` : `Using ${esc(cur || '')}`}</button></div>
  </div>`;
}

// === views/progress.js ===
// Weight chart, weigh-ins and weekly check-in
function weightChart(){
  const w = [...S.progress.weighins].sort((a, b) => a.date.localeCompare(b.date));
  if (w.length < 2) return `<div class="empty" style="padding:24px"><p>${w.length ? 'One weigh-in so far. Add a few more and the trend line appears; one reading on its own says little.' : 'Add your first weigh-in. Weighing 2–3 times a week, same time of day, gives a trend worth reading.'}</p></div>`;
  const W = 360, H = 190, L = 38, R = 12, T = 12, B = 26;
  const t0 = fromKey(w[0].date).getTime(), t1 = Math.max(fromKey(w[w.length-1].date).getTime(), t0 + 864e5);
  const vals = w.map(x => +x.weight); let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, 0.5); lo = Math.floor((lo - pad) * 2) / 2; hi = Math.ceil((hi + pad) * 2) / 2;
  const X = d => L + (fromKey(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const avg = w.map(x => { const win = w.filter(y => daysBetween(y.date, x.date) >= 0 && daysBetween(y.date, x.date) < 7); return { date:x.date, v: win.reduce((a, y) => a + +y.weight, 0) / win.length }; });
  const ticks = [lo, (lo + hi) / 2, hi];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    ${ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11.5" fill="var(--muted)" font-family="Plus Jakarta Sans, system-ui, sans-serif">${v.toFixed(1)}</text>`).join('')}
    <text x="${L}" y="${H-8}" font-size="11.5" fill="var(--muted)" font-family="Plus Jakarta Sans, system-ui, sans-serif">${fromKey(w[0].date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</text>
    <text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11.5" fill="var(--muted)" font-family="Plus Jakarta Sans, system-ui, sans-serif">${fromKey(w[w.length-1].date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</text>
    <path d="M${avg.map(a => `${X(a.date)},${Y(a.v)}`).join(' L')} L${X(avg[avg.length-1].date)},${H-B} L${X(avg[0].date)},${H-B}Z" fill="var(--accent)" opacity=".08"/>
    <polyline points="${avg.map(a => `${X(a.date)},${Y(a.v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
    ${w.map(x => `<circle cx="${X(x.date)}" cy="${Y(+x.weight)}" r="3" fill="var(--muted)"/>`).join('')}
    <circle cx="${X(avg[avg.length-1].date)}" cy="${Y(avg[avg.length-1].v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
  </svg>
  <div class="row muted" style="font-size:.8rem"><span style="display:inline-block;width:14px;height:3px;background:var(--accent)"></span>7-day average <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-left:10px"></span>single weigh-ins</div>`;
}

function vProgress(){
  const w = [...S.progress.weighins].sort((a, b) => a.date.localeCompare(b.date));
  const avg = end => { const win = w.filter(y => { const d = daysBetween(y.date, end); return d >= 0 && d < 7; }); return win.reduce((a, y) => a + +y.weight, 0) / win.length; };
  const now = w.length ? avg(w[w.length - 1].date) : null;
  const diff = w.length > 1 ? now - +w[0].weight : null, span = w.length > 1 ? daysBetween(w[0].date, w[w.length - 1].date) : 0;
  const days = new Set(S.profile.loggedDays || []), mon = fromKey(mondayOf());
  const logged = DAYS.filter((l, i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return days.has(dkey(d)); }).length;
  const lastCk = S.progress.checkins.slice(-1)[0]?.date || S.profile.onboardedAt, ckIn = lastCk ? 7 - daysBetween(lastCk, dkey()) : 0;
  const tile = (label, value, sub, act) => `<${act ? `button class="tile tile-btn" data-act="${act}"` : 'div class="tile"'}><span class="label">${label}</span><b class="num">${value}</b><span class="muted">${sub}</span></${act ? 'button' : 'div'}>`;
  return `
  <div class="head"><div><div class="label">Trends over single readings</div><h1>Progress</h1></div></div>
  <div class="tiles">
    ${tile('Weight', now ? now.toFixed(1) + '<small> kg</small>' : '–', now ? '7-day average' : 'Log your first weigh-in')}
    ${tile('Change', diff === null ? '–' : (Math.abs(diff) < 0.1 ? 'Steady' : (diff < 0 ? '↓ ' : '↑ ') + Math.abs(diff).toFixed(1) + '<small> kg</small>'), diff === null ? 'Needs 2 weigh-ins' : `over ${span >= 14 ? Math.round(span / 7) + ' weeks' : span + ' days'}`)}
    ${tile('Logged', logged + '<small>/7</small>', 'days this week')}
    ${tile('Check-in', ckIn <= 0 ? 'Due' : `${ckIn}<small> day${ckIn > 1 ? 's' : ''}</small>`, ckIn <= 0 ? 'Tap to start' : 'until the next one', 'cksheet')}
  </div>
  <section class="card stack">
    <div class="row" style="justify-content:space-between"><h2>Weight trend</h2><span class="muted" style="font-size:.8rem">Trend matters more than one day</span></div>
    ${weightChart()}
  </section>
  <section class="card stack">
    <h2>Log weight</h2>
    <div class="weigh-row"><div class="unit-input"><input type="number" id="wKg" step="0.1" inputmode="decimal" aria-label="Weight in kg" value="${w.length ? w[w.length-1].weight : (S.profile.data.basics?.weight_kg || '')}"><span>kg</span></div><button class="btn primary" data-act="weigh">Save</button></div>
    <details class="plan-notes"><summary>Another day or add waist</summary>
      <div class="fields two" style="margin-top:10px"><div class="field"><label for="wDate">Date</label><input type="date" id="wDate" value="${dkey()}" max="${dkey()}"></div>
      <div class="field"><label for="wWaist">Waist (cm)</label><input type="number" id="wWaist" step="0.5" inputmode="decimal"></div></div>
    </details>
    ${w.length ? `<details class="plan-notes"><summary>Recent weigh-ins</summary><div class="hist">${w.slice(-8).reverse().map(x => `<div class="mrow"><span class="mname">${fromKey(x.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}${x.waist ? ` <span class="muted">· waist ${x.waist} cm</span>` : ''}</span><span class="num">${x.weight} kg</span><button class="x small-x" data-act="delw" data-d="${x.date}" aria-label="Remove weigh-in">×</button></div>`).join('')}</div></details>` : ''}
  </section>
  ${S.ckSheet ? checkinSheet() : ''}`;
}

function checkinSheet(){
  const ck = S.ck || (S.ck = { adherence:7, hunger:5, energy:7 }), enter = S.ckSheet === 'enter' ? ' enter' : '';
  return `<div class="scrim${enter}" data-act="cksheet"></div>
  <div class="sheet${enter}" role="dialog" aria-modal="true" aria-label="Weekly check-in">
    <div class="grip" aria-hidden="true"></div>
    <div class="sheet-head"><h2>Weekly check-in</h2><button class="x close" data-act="cksheet" aria-label="Close">×</button></div>
    <p class="muted" style="font-size:.88rem">Two minutes. Your dietitian looks at the trend and adjusts the plan with you.</p>
    <div class="sliders">${[['adherence','Followed the plan'],['hunger','Hunger'],['energy','Energy']].map(([k, l]) => `<div class="sl"><label for="ck-${k}"><span>${l}</span><span class="num">${ck[k]}/10</span></label><input type="range" min="1" max="10" id="ck-${k}" data-ck="${k}" value="${ck[k]}"></div>`).join('')}</div>
    <div class="field"><label for="ckWeak">How did ${S.profile.focus ? esc(S.profile.focus.weak_point.toLowerCase()) : 'your weak point'} go?</label><input type="text" id="ckWeak" placeholder="e.g. Saturday was fine, Sunday brunch got away from me"></div>
    <details class="plan-notes"><summary>More details (optional)</summary>
      <div class="stack" style="margin-top:10px">
        <div class="field"><label for="ckSleep">Sleep</label><input type="text" id="ckSleep" placeholder="~7 h, waking at night"></div>
        <div class="field"><label for="ckDig">Digestion</label><input type="text" id="ckDig" placeholder="Fine / bloated / …"></div>

// The answer first: current 7-day average and change since the first weigh-in.
function trendSummary(){
  const w = [...S.progress.weighins].sort((a, b) => a.date.localeCompare(b.date));
  if (w.length < 2) return '';
  const avg = end => { const win = w.filter(y => { const d = daysBetween(y.date, end); return d >= 0 && d < 7; }); return win.reduce((a, y) => a + +y.weight, 0) / win.length; };
  const now = avg(w[w.length - 1].date), first = +w[0].weight, diff = now - first, days = daysBetween(w[0].date, w[w.length - 1].date);
  const span = days >= 14 ? `${Math.round(days / 7)} weeks` : `${days} days`;
  const dir = Math.abs(diff) < 0.1 ? 'steady' : (diff < 0 ? '↓ ' : '↑ ') + Math.abs(diff).toFixed(1) + ' kg';
  return `<div class="trend-head"><span class="big num">${now.toFixed(1)}<span class="muted" style="font-size:1rem;font-weight:700"> kg</span></span><span class="trend-pill">${dir} in ${span}</span></div>
  <p class="muted" style="font-size:.82rem">7-day average. Day-to-day changes are mostly water, so the trend matters more than any single weigh-in.</p>`;
}

// --- field helpers (value lives at a "section.key" path in S.ob.data) ---
const obGet = path => { const [a, b] = path.split('.'); return S.ob.data[a]?.[b]; };
function obSet(path, v){ const [a, b] = path.split('.'); S.ob.data[a] = { ...(S.ob.data[a] || {}), [b]: v }; }
function obChips(path, label, opts){
  const cur = String(obGet(path) ?? '');
  return `<fieldset class="ob-q"><legend>${label}</legend><div class="ob-chips">${opts.map(([v, l]) => `<button type="button" class="chip" data-ob="${path}" data-v="${esc(v)}" aria-pressed="${cur === String(v)}">${esc(l)}</button>`).join('')}</div></fieldset>`;
}
function obMulti(path, label, opts){
  const cur = String(obGet(path) || '').split(', ').filter(Boolean);
  return `<fieldset class="ob-q"><legend>${label}</legend><div class="ob-chips">${opts.map(o => `<button type="button" class="chip" data-obm="${path}" data-v="${esc(o)}" aria-pressed="${cur.includes(o)}">${cur.includes(o) ? '✓ ' : ''}${esc(o)}</button>`).join('')}</div></fieldset>`;
}
function obNum(path, label, unit, step = 1){
  const id = 'ob-' + path.replace('.', '-'), v = obGet(path);
  return `<div class="field"><label for="${id}">${label}</label><div class="unit-input sm"><input type="number" id="${id}" data-field="${path}" inputmode="${step < 1 ? 'decimal' : 'numeric'}" step="${step}" value="${v ?? ''}"><span>${unit}</span></div></div>`;
}
function obText(path, label, ph, area){
  const id = 'ob-' + path.replace('.', '-'), v = esc(obGet(path) ?? '');
  return `<div class="field"><label for="${id}">${label}</label>${area ? `<textarea id="${id}" data-field="${path}" rows="2" placeholder="${esc(ph)}">${v}</textarea>` : `<input type="text" id="${id}" data-field="${path}" placeholder="${esc(ph)}" value="${v}">`}</div>`;
}

function obMissing(){
  const b = S.ob.data.basics || {};
  return [['sex','sex'],['age','age'],['height_cm','height'],['weight_kg','weight'],['goal','goal'],['activity','activity']].filter(([k]) => !b[k]).map(([, l]) => l);
}

function vOnboarding(){

document.addEventListener('keydown', e => {

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-ob],[data-obm]'); if (!el || el.dataset.act === 'check') return;
  const a = el.dataset.act;
  const go = v => { S.view = v; render(); window.scrollTo(0, 0); };
  if (a === 'nav') { go(el.dataset.v); try { localStorage.setItem(LS + 'view', el.dataset.v); } catch {} }
  else if (a === 'send') sendChat(S.draft.chat);
  else if (a === 'quick') { if (el.dataset.q === 'Weekly check-in') { go('progress'); S.ckSheet = 'enter'; document.body.classList.add('sheet-open'); render(); S.ckSheet = true; } else sendChat(el.dataset.q); }
  else if (a === 'ask') { const t = S.draft.ask; go('coach'); sendChat(t); }
  else if (a === 'askquick') { go('coach'); sendChat(el.dataset.q); }
  else if (a === 'nophoto') { e.preventDefault(); S.logPhoto = null; render(); }
  else if (a === 'about') {
    if (S.aboutOpen) { S.aboutOpen = null; document.body.classList.remove('sheet-open'); render(); }
    else { S.aboutOpen = 'enter'; document.body.classList.add('sheet-open'); render(); S.aboutOpen = true; }
  }
  else if (a === 'newchat') { maybeNewSession(true); render(); scrollChat(); }
  else if (a === 'history') { S.chat.history = true; render(); $('.msgs')?.scrollTo(0, 0); }
  else if (a === 'coachtone') { S.profile.data.coach = { ...(S.profile.data.coach || {}), tone: el.dataset.v }; save.profile(); render(); }
  else if (a === 'startob') startOnboarding();
  else if (a === 'editob') { S.aboutOpen = null; document.body.classList.remove('sheet-open'); startOnboarding(true); }
  else if (a === 'obnext') obNext();
  else if (a === 'obskip') { if (S.ob.step < OB_STEPS.length - 1) { obSave(); S.ob.step++; window.scrollTo(0, 0); render(); } else finishOnboarding(); }
  else if (a === 'obback') obBack();
  else if (a === 'obclose') closeOnboarding();
  else if (el.dataset.ob) { obSet(el.dataset.ob, el.dataset.v); render(); }
  else if (el.dataset.obm) {
    // Multi-choice: "None" clears the others, picking anything clears "None".
    const path = el.dataset.obm, v = el.dataset.v; let cur = String(obGet(path) || '').split(', ').filter(Boolean);
    cur = cur.includes(v) ? cur.filter(x => x !== v) : v === 'None' ? ['None'] : [...cur.filter(x => x !== 'None'), v];
    obSet(path, cur.join(', ')); render();
  }
  else if (a === 'gotoday') gotoDay(el.dataset.k);
  else if (a === 'prevweek') shiftDay(-7);
  else if (a === 'nextweek') shiftDay(7);
  else if (a === 'openlog') openSheet(el.dataset.s);
  else if (a === 'closesheet') closeSheet();
  else if (a === 'togglemeal') { S.openMeal = S.openMeal === el.dataset.s ? null : el.dataset.s; render(); }

  else if (a === 'confirmlog') confirmLog();
  else if (a === 'editlog') { S.logResult = null; render(); }
  else if (a === 'dropitem') { S.logResult.review.splice(+el.dataset.n, 1); S.logResult.editing = null; render(); }
  else if (a === 'edititem') { S.logResult.editing = +el.dataset.n; render(); $(`#e-amount-${el.dataset.n}`)?.focus(); }
  else if (a === 'addrow') { S.logResult.adding = true; render(); $('#moreText')?.focus(); }
  else if (a === 'togglesave') { S.logResult.save = !S.logResult.save; render(); }
  else if (a === 'doneedit') { S.logResult.editing = null; render(); }
  else if (a === 'usesaved') useSaved(el.dataset.id);
  else if (a === 'forgetsaved') forgetSaved(el.dataset.id);
  else if (a === 'allmeals') { S.sheet.allMeals = !S.sheet.allMeals; render(); }
  else if (a === 'editmeal') editMeal(el.dataset.s);
  else if (a === 'slot') { S.logSlot = el.dataset.s; render(); }
  else if (a === 'log') { S.logResult = null; analyseFood(S.draft.log); }
  else if (a === 'clarify') analyseFood(S.logResult.text, el.dataset.o);
  else if (a === 'bestguess') { S.logResult = { review:S.logResult.items, feedback:null }; render(); }
  else if (a === 'del') {
    const day = vday(), L = S.logs[day], idx = L.items.findIndex(i => i.id === el.dataset.id); if (idx < 0) return;
    const [gone] = L.items.splice(idx, 1); save.log(day);
    showToast(`Removed ${gone.name}`, () => { L.items.splice(idx, 0, gone); save.log(day); }); render();
  }
  else if (a === 'undo') { const u = S.toastUndo; S.toast = null; S.toastUndo = null; if (u) u(); render(); }
  else if (a === 'manual') {
    const n = $('#mName').value.trim(); if (!n) { $('#mName').focus(); return; }
    const slot = S.sheet?.slot || S.logSlot;
    addItems([{ name:n, kcal:$('#mK').value, protein:$('#mP').value, carbs:$('#mC').value, fat:$('#mF').value, slot, amount:'manual entry' }]);
    showToast(`Added to ${slot} · ${r0($('#mK').value)} kcal`); closeSheet();
  }
  else if (a === 'genplan') generatePlan();
  else if (a === 'day') { S.planDay = +el.dataset.i; render(); }
  else if (a === 'planmeal') { S.planSheet = { i:+el.dataset.i, j:+el.dataset.j, enter:true }; document.body.classList.add('sheet-open'); render(); S.planSheet.enter = false; }
  else if (a === 'closeplan') { S.planSheet = null; document.body.classList.remove('sheet-open'); render(); }
  else if (a === 'recipe') loadRecipe(el.dataset.k, S.plan.days[+el.dataset.i].meals[+el.dataset.j]);
  else if (a === 'logmeal') {
    const m = S.plan.days[+el.dataset.i].meals[+el.dataset.j];
    const slot = SLOTS.includes(m.slot) ? m.slot : slotNow();
    addItems([{ name:m.name, amount:m.portion, kcal:m.kcal, protein:m.p, carbs:m.c, fat:m.f, slot }], dkey());
    S.planSheet = null; document.body.classList.remove('sheet-open');
    showToast(`Added to today's ${slot.toLowerCase()} · ${r0(m.kcal)} kcal`); render();
  }
  else if (a === 'clearchecks') { S.plan.checked = {}; (S.plan.extra || []).forEach(x => x.done = false); save.plan(); render(); }
  else if (a === 'genshop') { const st = S.shopStore || S.plan.store || storeOptions()[0]; S.shopStore = st; S.storeOther = false; S.storeSheet = null; document.body.classList.remove('sheet-open'); go('shop'); generateShopping(st).then(() => { S.shopStore = null; render(); }); }
  else if (a === 'store') { S.shopStore = el.dataset.s; S.storeOther = false; render(); }
  else if (a === 'shoptab') { S.shopTab = el.dataset.t; render(); }
  else if (a === 'storesheet') {
    if (S.storeSheet) { S.storeSheet = null; S.shopStore = null; S.storeOther = false; document.body.classList.remove('sheet-open'); }
    else { S.storeSheet = 'enter'; document.body.classList.add('sheet-open'); }
    render(); if (S.storeSheet) S.storeSheet = true;
  }
  else if (a === 'storeother') { S.storeOther = !S.storeOther; render(); $('#storeName')?.focus(); }
  else if (a === 'delextra') {
    const before = S.plan.extra || [], gone = before.find(x => 'x-' + x.id === el.dataset.k);
    S.plan.extra = before.filter(x => x !== gone); save.plan();
    if (gone) showToast(`Removed ${gone.name}`, () => { S.plan.extra = before; save.plan(); }); render();
  }
  else if (a === 'weigh') {
    const kg = parseFloat($('#wKg').value), date = $('#wDate').value || dkey(), waist = parseFloat($('#wWaist').value);
    if (!kg || kg < 25 || kg > 350) { $('#wKg').focus(); return; }
    S.progress.weighins = S.progress.weighins.filter(x => x.date !== date).concat([{ date, weight: Math.round(kg*10)/10, ...(waist ? { waist } : {}) }]).sort((x, y) => x.date.localeCompare(y.date)).slice(-120);
    if (date === dkey()) { S.profile.data = merge(S.profile.data, { basics:{ weight_kg: Math.round(kg*10)/10 } }); save.profile(); }
    save.progress(); showToast(`Saved ${Math.round(kg*10)/10} kg`); render();
  }
  else if (a === 'delw') {
    const before = S.progress.weighins; S.progress.weighins = before.filter(x => x.date !== el.dataset.d); save.progress();
    showToast('Removed weigh-in', () => { S.progress.weighins = before; save.progress(); }); render();
  }
  else if (a === 'startcheckin') { go('progress'); S.ckSheet = 'enter'; document.body.classList.add('sheet-open'); render(); S.ckSheet = true; }
  else if (a === 'cksheet') {
    if (S.ckSheet) { S.ckSheet = null; document.body.classList.remove('sheet-open'); }
    else { S.ckSheet = 'enter'; document.body.classList.add('sheet-open'); }
    render(); if (S.ckSheet) S.ckSheet = true;
  }
  else if (a === 'checkin') {
    const v = id => $('#' + id).value.trim();
    const c = { date:dkey(), ...S.ck, sleep:v('ckSleep'), digestion:v('ckDig'), training:v('ckTrain'), loved:v('ckLoved'), disliked:v('ckDisliked'), changes:v('ckChange'), weak:v('ckWeak'), notes:v('ckNotes') };
    S.progress.checkins = S.progress.checkins.concat([c]).slice(-52); save.progress();
    const w = [...S.progress.weighins].slice(-6).map(x => `${x.date}: ${x.weight} kg${x.waist ? `, waist ${x.waist} cm` : ''}`).join('; ');
    const msg = `Weekly check-in.\nAdherence ${c.adherence}/10 · hunger ${c.hunger}/10 · energy ${c.energy}/10` +
      (c.sleep ? `\nSleep: ${c.sleep}` : '') + (c.digestion ? `\nDigestion: ${c.digestion}` : '') + (c.training ? `\nTraining: ${c.training}` : '') +
      (c.weak ? `\nWeak point${S.profile.focus ? ' (' + S.profile.focus.weak_point + ')' : ''}: ${c.weak}` : '') + (c.loved ? `\nLoved: ${c.loved}` : '') + (c.disliked ? `\nDisliked / tired of: ${c.disliked}` : '') + (c.changes ? `\nChanges: ${c.changes}` : '') +
      (c.notes ? `\nNotes: ${c.notes}` : '') + (w ? `\nRecent weigh-ins: ${w}` : '');
    S.ck = null; S.ckSheet = null; document.body.classList.remove('sheet-open'); go('coach'); sendChat(msg);
  }
  else if (a === 'askweak') { go('coach'); sendChat(S.profile.focus ? `Let's talk about my weak point (${S.profile.focus.weak_point}). What else could help?` : 'I want to talk about what I think holds me back.'); }
  else if (a === 'authmode') { S.authDraft = { email: $('#authEmail')?.value || '' }; S.auth = { status:'signed-out', mode: S.auth.mode === 'signup' ? 'signin' : 'signup' }; render(); }
  else if (a === 'forgot') { const em = $('#authEmail')?.value.trim(); S.authDraft = { email: em }; Auth.reset(em); }
  else if (a === 'signout') { S.authDraft = { email: S.auth.email }; Auth.signOut(); }
  else if (a === 'reset') { S.confirmReset = true; render(); }
  else if (a === 'reset-no') { S.confirmReset = false; render(); }
  else if (a === 'reset-yes') {
    ['profile','chat','plan','progress','log-' + dkey()].forEach(k => Store.remove(k));
    S.profile = { data:{}, targets:null, targetsSource:null, nextQuestion:null, quick:[], onboarded:false, onboardedAt:null, flags:[] };
    S.chat = { turns:[] }; S.plan = null; S.progress = { weighins:[], checkins:[] }; S.logs = { [dkey()]: { items:[] } }; S.confirmReset = false; render();
  }
});
// Hide the bottom menu only while the on-screen keyboard is really open.
// (On iPhone a text box can stay focused after the keyboard closes, so focus
// alone isn't a reliable signal; the visible viewport shrinking is.)
function syncKeyboard(){
  const vv = window.visualViewport;
  const open = !!vv && window.innerWidth <= 820 && vv.height < window.innerHeight * 0.78;
  document.body.classList.toggle('kb-open', open);
}
window.visualViewport?.addEventListener('resize', syncKeyboard);
document.addEventListener('focusout', () => setTimeout(syncKeyboard, 300));

// === main.js ===
// Boot: connect sign-in, restore the last tab, register the offline worker
S.sample = AI;
try { const v = localStorage.getItem(LS + 'view'); if (v && TABS.some(t => t[0] === v)) S.view = v; } catch {}
if (Auth.init()) Auth.start(); else render();
addEventListener('online', render); addEventListener('offline', render);
// Phones keep the app alive in the background, so pull the latest data from
// your account whenever the app comes back to the front (e.g. after using the laptop).
let lastSync = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || S.auth.status !== 'signed-in' || Date.now() - lastSync < 15000) return;
  lastSync = Date.now();
  syncRemote();
  navigator.serviceWorker?.getRegistration().then(r => r?.update()).catch(() => {});
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
