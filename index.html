// Shrink a photo to ~1024 px JPEG so uploads stay small and fast.
function photoToBase64(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ mime:'image/jpeg', data:c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ code:'image_rejected', message:'That photo couldn\'t be read. Try a JPEG or PNG.' }); };
    img.src = url;
  });
}

const AI = {
  async json(input, opts = {}){
    if (!navigator.onLine) throw { code:'offline' };
    const token = await Auth.token();
    if (!token) throw { code:'unauthorized' };
    const images = opts.images ? await Promise.all([...opts.images].map(photoToBase64)) : [];
    let res;
    try {
      const c = window.FORKCAST_CONFIG || {};
      res = await fetch(c.aiUrl || c.supabaseUrl + '/functions/v1/ai', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token, apikey:c.supabaseAnonKey },
        body: JSON.stringify({ input, images, tier: opts.modelTier === 'quick' ? 'quick' : 'default', json:true }) });
    } catch { throw { code:'offline' }; }
    const body = await res.json().catch(() => ({}));
    // Errors may arrive with status 200, because the server starts streaming before Gemini answers.
    if (!res.ok || body.code) throw { code: body.code || 'upstream_error', message: body.message };
    console.info(`AI answered with ${body.model} in ${body.ms} ms`);
    return body.json;
  },
  // Streamed answer: onText(fullTextSoFar) is called as words arrive.
  async stream(input, opts = {}){
    if (!navigator.onLine) throw { code:'offline' };
    const token = await Auth.token();
    if (!token) throw { code:'unauthorized' };
    const c = window.FORKCAST_CONFIG || {};
    let res;
    try {
      res = await fetch(c.aiUrl || c.supabaseUrl + '/functions/v1/ai', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token, apikey:c.supabaseAnonKey },
        body: JSON.stringify({ input, tier: opts.modelTier === 'quick' ? 'quick' : 'default', stream:true }) });
    } catch { throw { code:'offline' }; }
    if (!res.ok) { const b = await res.json().catch(() => ({})); throw { code: b.code || 'upstream_error', message: b.message }; }
    const reader = res.body.getReader(), dec = new TextDecoder(); let text = '';
    for (;;) { const { done, value } = await reader.read(); if (done) break; text += dec.decode(value, { stream:true }); opts.onText?.(text); }
    if (!text.trim()) throw { code:'empty_completion' };
    return text;
  }
};

// === services/auth.js ===
// Sign-in with Supabase (email + password). Keeps the session on the device,
// so you stay signed in until you sign out.
const Auth = {
  sb: null,
  init(){
    const c = window.FORKCAST_CONFIG || {};
    if (!window.supabase || !c.supabaseUrl || !c.supabaseAnonKey) { S.auth = { status:'unconfigured' }; return false; }
    this.sb = supabase.createClient(c.supabaseUrl, c.supabaseAnonKey, { auth:{ persistSession:true, autoRefreshToken:true } });
    Store.sb = this.sb;
    this.sb.auth.onAuthStateChange((event, session) => {
      if (session?.user && Store.uid !== session.user.id) setTimeout(() => this.enter(session.user), 0);
      if (event === 'SIGNED_OUT') this.leave();
    });
    return true;
  },
  async start(){
    const { data } = await this.sb.auth.getSession();
    if (data.session?.user) this.enter(data.session.user);
    else { S.auth = { status:'signed-out', mode:'signin' }; render(); }
  },
  async token(){ const { data } = await this.sb.auth.getSession(); return data.session?.access_token || null; },
  enter(user){
    Store.uid = user.id;
    S.auth = { status:'signed-in', email:user.email };
    resetState(); loadLocal(); render(); syncRemote();
  },
  leave(){ Store.uid = null; resetState(); S.auth = { status:'signed-out', mode:'signin' }; render(); },
  async submit(mode, email, password){
    S.auth.busy = true; S.auth.error = null; S.auth.info = null; render();
    const redirect = location.origin + location.pathname;
    const { data, error } = mode === 'signup'
      ? await this.sb.auth.signUp({ email, password, options:{ emailRedirectTo:redirect } })
      : await this.sb.auth.signInWithPassword({ email, password });
    S.auth.busy = false;
    if (error) S.auth.error = error.message;
    else if (mode === 'signup' && !data.session) { S.auth.info = 'Check your email and tap the confirmation link, then sign in here.'; S.auth.mode = 'signin'; }
    render();
  },
  async reset(email){
    if (!email) { S.auth.error = 'Type your email first, then tap “Forgot password”.'; render(); return; }
    const { error } = await this.sb.auth.resetPasswordForEmail(email, { redirectTo:location.origin + location.pathname });
    S.auth.error = error ? error.message : null; S.auth.info = error ? null : 'We sent you an email with a link to set a new password.'; render();
  },
  async signOut(){ await this.sb.auth.signOut(); }
};

// === services/coach.js ===
// Dietitian chat: sends the conversation, applies profile, targets, focus and log updates
async function sendChat(text){
  text = text.trim();
  if (!text || S.busy.chat) return;
  if (!S.sampleOK) { S.err.chat = 'Sign in to talk to your dietitian.'; render(); return; }
  if (!S.chat.turns.length) S.chat.turns.push({ role:'assistant', content:greeting(), at:Date.now() });
  S.chat.turns.push({ role:'user', content:text, at:Date.now() });
  S.chat.history = false; S.draft.chat = ''; S.draft.ask = ''; S.err.chat = null; S.busy.chat = true;
  save.chat(); render(); scrollChat();
  const history = S.chat.turns.slice(S.chat.start || 0).slice(-20).map(t => ({ role:t.role, content:t.content }));
  const input = PROMPTS.coach(appState(), history, S.profile.onboarded, coachPersona());
  try {
    // Everyday chat uses the fast model; the reply streams in word by word.
    S.chat.live = '';
    const full = await S.sample.stream(input, { modelTier: S.profile.onboarded ? 'quick' : 'default', onText: t => showLive(t) });
    const [replyPart, dataPart = ''] = full.split('@@DATA@@');
    const reply = replyPart.trim() || 'Could you tell me a bit more?';
    const r = looseJson(dataPart) || {};
    if (isObj(r.profile_patch)) S.profile.data = merge(S.profile.data, r.profile_patch);
    if (isObj(r.targets) && r.targets.kcal) { S.profile.targets = { kcal:r0(r.targets.kcal), protein:r0(r.targets.protein), carbs:r0(r.targets.carbs), fat:r0(r.targets.fat), fiber:r0(r.targets.fiber) }; S.profile.targetsSource = 'coach'; }
    if (isObj(r.focus) && r.focus.weak_point) S.profile.focus = { weak_point:String(r.focus.weak_point), why:String(r.focus.why || ''), tips:(Array.isArray(r.focus.tips) ? r.focus.tips : []).slice(0,5).map(String), at:dkey() };
    if (r.medical_flag) S.profile.flags = [...new Set([...(S.profile.flags || []), String(r.medical_flag)])].slice(-5);
    S.profile.quick = Array.isArray(r.quick_replies) ? r.quick_replies.slice(0,4).map(String) : [];
    let logged = 0;
    if (Array.isArray(r.log_items) && r.log_items.length) { addItems(r.log_items.map(i => ({...i, slot: SLOTS.includes(i.slot) ? i.slot : slotNow()})), dkey()); logged = r.log_items.length; }
    S.chat.turns.push({ role:'assistant', content:reply, quick:S.profile.quick, flag:r.medical_flag || null, logged, done:r.done === true, at:Date.now() });
    save.profile(); save.chat();
  } catch (e) {
    hardFail(e); S.err.chat = errText(e);
  }
  S.chat.live = null;
  S.busy.chat = false; render(); scrollChat();
}
function scrollChat(){ const m = $('.msgs'); if (m) m.scrollTop = m.scrollHeight; }

// A fresh conversation each day (or after 6 quiet hours): a short greeting that
// fits the moment, with suggestions. Earlier messages stay available on request.
// The greeting is written on the device, so it costs no AI call.
function maybeNewSession(force){
  const turns = S.chat.turns, last = turns[turns.length - 1];
  if (!force && (!turns.length || !S.profile.onboarded)) return;
  const lastAt = last?.at || 0, stale = !lastAt || dkey(new Date(lastAt)) !== dkey() || Date.now() - lastAt > 6 * 36e5;
  if (!force && !stale) return;
  if (last?.fresh) turns.pop(); // an untouched old greeting: refresh it instead of stacking
  const h = new Date().getHours(), hi = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const t = targets(), eaten = sumItems(S.logs[dkey()]?.items || []);
  const checkDue = (() => { const l = S.progress.checkins.slice(-1)[0]?.date || S.profile.onboardedAt; return l && daysBetween(l, dkey()) >= 7; })();
  const line = !S.profile.onboarded ? 'Shall we pick up your consultation where we left off?'
    : checkDue ? 'It\'s been a week, so a quick check-in would help me fine-tune your plan.'
    : eaten.kcal && t ? `So far today: ${eaten.kcal} of ${t.kcal} kcal and ${eaten.protein} g protein. How can I help?`
    : 'What would you like to work on today?';
  const quick = !S.profile.onboarded ? ['Let\'s continue'] : [
    ...(checkDue ? ['Weekly check-in'] : []),
    h < 11 ? 'Ideas for breakfast' : h < 16 ? 'Ideas for lunch' : 'What should I have for dinner?',
    'How am I doing this week?', 'I have a question'
  ].slice(0, 4);
  S.chat.start = turns.length;
  turns.push({ role:'assistant', content:`${hi}! ${line}`, quick, at:Date.now(), fresh:true });
  S.chat.history = false;
  save.chat();
}

// Paint the reply as it streams, without redrawing the whole screen.
function showLive(full){
  const visible = full.split('@@DATA@@')[0].replace(/@+[DAT]*@*$/, '').trim();
  if (!visible) return;
  if (S.chat.live === '' || !document.getElementById('liveMsg')) { S.chat.live = visible; render(); }
  S.chat.live = visible;
  const el = document.getElementById('liveMsg'); if (el) el.innerHTML = md(visible);
  scrollChat();
}
// Tolerant JSON read for the data block after the reply.
function looseJson(t){
  t = String(t || ''); const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(t.slice(a, b + 1)); } catch { return null; }
}

// === services/food.js ===
// Food diary: adding items and estimating meals from text or photos
function addItems(items, k = vday()){
  S.logs[k] = S.logs[k] || {items:[]};
  for (const i of items) S.logs[k].items.push({ id:uid(), slot:i.slot || S.logSlot, name:String(i.name || 'Food'), amount:String(i.amount || ''), kcal:r0(i.kcal), protein:r0(i.protein ?? i.p), carbs:r0(i.carbs ?? i.c), fat:r0(i.fat ?? i.f), fiber:r0(i.fiber), at:Date.now() });
  save.log(k);
  const days = new Set(S.profile.loggedDays || []); if (!days.has(k)) { days.add(k); S.profile.loggedDays = [...days].sort().slice(-90); save.profile(); }
}

async function analyseFood(text, clarification){
  if (S.busy.log) return;
  if (!S.sampleOK) { S.err.log = 'Sign in to count meals automatically, or tap “I know the calories”.'; render(); return; }
  if (!text.trim() && !S.logPhoto) return;
  S.busy.log = true; S.err.log = null; render();
  const t = targets(), eaten = sumItems(S.logs[vday()]?.items || []);
  const prompt = PROMPTS.food({ text, slot:S.logSlot, country:S.profile.data.shopping?.country, eaten,
    targets: t && { kcal:t.kcal, protein:t.protein, carbs:t.carbs, fat:t.fat, fiber:t.fiber },
    hasPhoto: !!S.logPhoto, hasAfter: !!(S.logPhoto && S.logPhotoAfter), clarification });
  try {
    const opts = { modelTier:'quick' }; // fast model, minimal thinking: a meal estimate doesn't need more
    if (S.logPhoto && S.canImages) opts.images = S.logPhotoAfter ? [S.logPhoto, S.logPhotoAfter] : [S.logPhoto];
    const r = await S.sample.json(prompt, opts);
    const items = Array.isArray(r?.items) ? r.items : [];
    if (r?.clarify && !clarification) {
      S.logResult = { text, clarify:String(r.clarify), options:(r.options || []).slice(0,4).map(String), items };
    } else {
      S.logResult = { review: items.map(cleanItem), share: 1, feedback: r?.feedback ? String(r.feedback) : null, name: String(r?.meal_name || '').slice(0, 40), save: true };
    }
  } catch (e) { hardFail(e); S.err.log = errText(e); }
  S.busy.log = false; render();
}

// "How much did you eat?": scale the whole plate to the share eaten (e.g. 3 of 6 slices = ½).
const SHARES = [[1,'All'],[.75,'¾'],[2/3,'⅔'],[.5,'½'],[1/3,'⅓'],[.25,'¼']];
function eatenShare(r, items){
  const f = r?.share || 1; if (f === 1) return items;
  const label = SHARES.find(([v]) => v === f)?.[1] || Math.round(f * 100) + '%';
  return items.map(i => ({ ...i, amount: `${label} of ${i.amount || 'portion'}`, kcal:r0(i.kcal * f), protein:r0(i.protein * f), carbs:r0(i.carbs * f), fat:r0(i.fat * f), fiber:r0(i.fiber * f) }));
}

const cleanItem = i => ({ name:String(i.name || 'Food'), amount:String(i.amount || ''), kcal:r0(i.kcal), protein:r0(i.protein ?? i.p), carbs:r0(i.carbs ?? i.c), fat:r0(i.fat ?? i.f), fiber:r0(i.fiber) });

// Save the reviewed (and possibly edited) items to the open meal, remember the
// combination under "My meals", and close the sheet.
function confirmLog(){
  const r = S.logResult, items = eatenShare(r, (r?.review || []).filter(i => i.name.trim()));
  if (!items.length) return;
  const slot = S.sheet.slot;
  if (r.replaceIds) { const L = S.logs[vday()]; L.items = L.items.filter(i => !r.replaceIds.includes(i.id)); }
  addItems(items.map(i => ({...i, slot})));
  if (r.save && items.length) rememberMeal(r, r.review.filter(i => i.name.trim()).map(cleanItem), slot);
  showToast(`${r.replaceIds ? 'Updated' : 'Added to'} ${slot} · ${sumItems(items).kcal} kcal${r.save && !r.replaceIds ? ' · saved' : ''}`);
  closeSheet();
}

// "My meals": reusable combinations, most used first for each meal slot.
function rememberMeal(r, items, slot){
  const meals = S.profile.savedMeals || [];
  const name = (r.name || items.map(i => i.name).slice(0, 2).join(' & ')).trim().slice(0, 40);
  const sig = items.map(i => i.name.toLowerCase()).sort().join('|');
  let m = meals.find(x => x.id === r.savedId) || meals.find(x => x.items.map(i => i.name.toLowerCase()).sort().join('|') === sig);
  if (!m) { m = { id:uid(), uses:0, slots:{} }; meals.unshift(m); }
  Object.assign(m, { name, items: items.map(cleanItem), last: Date.now(), uses: (m.uses || 0) + 1 });
  m.slots[slot] = (m.slots[slot] || 0) + 1;
  S.profile.savedMeals = meals.slice(0, 40); save.profile();
}
function savedFor(slot){
  return [...(S.profile.savedMeals || [])].sort((a, b) => ((b.slots?.[slot] || 0) - (a.slots?.[slot] || 0)) || (b.last - a.last));
}
function useSaved(id){
  const m = (S.profile.savedMeals || []).find(x => x.id === id); if (!m) return;
  S.logResult = { review: m.items.map(i => ({...i})), name: m.name, savedId: m.id, save: true, feedback: null };
  render();
}
function forgetSaved(id){
  const before = S.profile.savedMeals || [], gone = before.find(x => x.id === id);
  S.profile.savedMeals = before.filter(x => x.id !== id); save.profile();
  if (gone) showToast(`Removed ${gone.name}`, () => { S.profile.savedMeals = before; save.profile(); });
  render();
}
// Re-open a logged meal in the editor; saving replaces those items.
function editMeal(slot){
  const its = (S.logs[vday()]?.items || []).filter(i => i.slot === slot);
  openSheet(slot);
  S.logResult = { review: its.map(cleanItem), replaceIds: its.map(i => i.id), name: '', save: false, feedback: null };
  render();
}
// Add a forgotten item to the review: estimated by the AI, or blank to fill in.
async function addToReview(text){
  text = text.trim(); const r = S.logResult; if (!r) return;
  if (!text) { r.review.push(cleanItem({ name:'', kcal:0 })); r.editing = r.review.length - 1; render(); return; }
  S.busy.addItem = true; render();
  try {
    const out = await S.sample.json(PROMPTS.food({ text, slot:S.sheet.slot, country:S.profile.data.shopping?.country, eaten:{}, targets:null, hasPhoto:false, clarification:'use a typical portion' }), { modelTier:'quick' });
    (Array.isArray(out?.items) ? out.items : []).forEach(i => r.review.push(cleanItem(i)));
    S.draft.more = ''; r.adding = false;
  } catch (e) { hardFail(e); S.err.log = errText(e); }
  S.busy.addItem = false; render();
}
function openSheet(slot){ S.sheet = { slot, enter:true }; S.logSlot = slot; S.logResult = null; S.err.log = null; document.body.classList.add('sheet-open'); render(); S.sheet.enter = false; setTimeout(() => $('#logText')?.focus(), 250); }
function closeSheet(){ S.sheet = null; S.logResult = null; S.err.log = null; S.draft.log = ''; S.logPhoto = null; S.logPhotoAfter = null; document.body.classList.remove('sheet-open'); render(); }
let toastTimer;
function showToast(text, undo){ S.toast = text; S.toastUndo = undo || null; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; S.toastUndo = null; render(); }, undo ? 5000 : 2600); }

// Show another day on Today; its food log loads from the device, then the account.
async function gotoDay(k){
  const today = dkey(); if (k > today) k = today;
  S.day = k === today ? null : k; S.openMeal = null;
  if (!S.logs[k]) S.logs[k] = Store.local('log-' + k) || { items:[] };
  render(); window.scrollTo(0, 0);
  const v = await Store.remote('log-' + k);
  if (v && vday() === k) { S.logs[k] = v; render(); }
}
function shiftDay(n){ const d = fromKey(vday()); d.setDate(d.getDate() + n); gotoDay(dkey(d)); }

async function generatePlan(){

// Supermarkets to choose from: the person's own first, then common ones for their country.
const STORES_BY_COUNTRY = {
  spain:['Mercadona','Lidl','Carrefour','Aldi','Dia','Alcampo','Eroski'],
  greece:['Sklavenitis','AB Vassilopoulos','Lidl','My Market','Masoutis'],
  'united kingdom':['Tesco','Sainsbury\'s','Aldi','Lidl','Asda','Waitrose'],
  uk:['Tesco','Sainsbury\'s','Aldi','Lidl','Asda','Waitrose'],
  'united states':['Walmart','Trader Joe\'s','Whole Foods','Costco','Kroger','Aldi'],
  usa:['Walmart','Trader Joe\'s','Whole Foods','Costco','Kroger','Aldi'],
  france:['Carrefour','Leclerc','Lidl','Auchan','Intermarché'],
  germany:['Rewe','Edeka','Lidl','Aldi','Kaufland'],
  italy:['Esselunga','Coop','Conad','Lidl','Carrefour']
};
function storeOptions(){
  const sh = S.profile.data.shopping || {};
  const own = [...String(sh.supermarkets || '').split(/,|\/| and /), ...String(sh.supermarkets_other || '').split(/,|\/| and /)].map(s => s.trim()).filter(s => s && s !== 'Other');
  const country = String(S.profile.data.shopping?.country || '').toLowerCase().trim();
  const local = STORES_BY_COUNTRY[country] || ['Lidl','Aldi','Carrefour'];
  const list = [...own, ...local, ...(S.plan?.store ? [S.plan.store] : [])];
  return [...new Map(list.map(s => [s.toLowerCase(), s])).values()].slice(0, 8);
}

// Build the shopping list and prep schedule from the current week plan, for one supermarket.
async function generateShopping(store){
  if (!S.plan?.days || S.busy.shop) return;
  if (!S.sampleOK) { S.err.shop = 'Sign in to create your shopping list.'; render(); return; }
  store = store || S.plan.store || storeOptions()[0] || '';
  S.busy.shop = true; S.err.shop = null; render();
  try {
    const shop = await S.sample.json(PROMPTS.shopping(planContext(), S.plan.days, store), { modelTier:'default', cache:false });
    if (!Array.isArray(shop?.grocery) || !shop.grocery.length) throw { code:'invalid_json' };
    Object.assign(S.plan, { store, grocery: shop.grocery, prep: Array.isArray(shop?.prep) ? shop.prep : [], budget_note: shop?.budget_note || '', checked:{} });
    save.plan();
  } catch (e) { hardFail(e); S.err.shop = errText(e); }
  S.busy.shop = false; render();
}
async function loadRecipe(key, meal){
  if (S.plan.recipes?.[key]) { render(); return; }
  if (!S.sampleOK) { S.err.plan = 'Sign in to see recipes.'; render(); return; }
  S.busy.recipe = key; S.openRecipe = key; render();
  try {
    const r = await S.sample.json(PROMPTS.recipe(meal, { prefs:S.profile.data.preferences, cooking:S.profile.data.cooking, country:S.profile.data.shopping?.country }), { modelTier:'quick', cache:{gcTime:864e5} });
    S.plan.recipes = S.plan.recipes || {}; S.plan.recipes[key] = r; save.plan();
  } catch (e) { hardFail(e); S.err.plan = errText(e); S.openRecipe = null; }
  S.busy.recipe = null; render();
}

// Dish photos from Pexels via /api/photo. Fetched once per meal for the day
// being viewed, then saved inside the plan so they never load twice.
const photoBusy = new Set();
async function loadDayPhotos(di){
  if (S.photosOff || !window.FORKCAST_CONFIG?.photoUrl || !S.plan?.days?.[di]) return;
  S.plan.photos = S.plan.photos || {};
  const todo = S.plan.days[di].meals.map((m, j) => [di + '-' + j, m]).filter(([k]) => !(k in S.plan.photos) && !photoBusy.has(k));
  if (!todo.length) return;
  const token = await Auth.token(); if (!token) return;
  todo.forEach(([k]) => photoBusy.add(k));
  let changed = false;
  await Promise.all(todo.map(async ([k, m]) => {
    try {
      const res = await fetch(window.FORKCAST_CONFIG.photoUrl + '?q=' + encodeURIComponent(m.photo || m.name), { headers:{ Authorization:'Bearer ' + token } });
      const body = await res.json().catch(() => ({}));
      if (res.ok && body.src) { S.plan.photos[k] = body; changed = true; }
      else if (body.code === 'not_found') { S.plan.photos[k] = null; changed = true; }
      else if (body.code === 'not_configured') S.photosOff = true;
    } catch {}
    photoBusy.delete(k);
  }));
  if (changed) { save.plan(); if (S.view === 'plan') render(); }
}

// === services/onboarding.js ===
// Onboarding flow: open, move between steps, save, finish, and the one AI review.
function startOnboarding(edit){
  S.ob = { q:0, data: JSON.parse(JSON.stringify(S.profile.data || {})), edit: !!edit };
  const b = S.ob.data.basics; if (b?.goal === 'recomposition') { b.goal = 'toned'; b.toned_focus = b.toned_focus || 'both'; } // older answer
  S.obDone = false; window.scrollTo(0, 0); render();
}
function obSave(){ S.profile.data = JSON.parse(JSON.stringify(S.ob.data)); save.profile(); }
// Next question (skipping ones that don't apply); the last one finishes.
function obNext(skip){
  if (!S.ob || S.obDone) return;
  const list = obVisible(), q = list[Math.min(S.ob.q, list.length - 1)];
  if (!skip && obMissing(q)) { S.ob.tried = true; render(); return; }
  obSave(); document.activeElement?.blur?.();
  const next = obVisible();
  if (S.ob.q < next.length - 1) { S.ob.q++; S.ob.tried = false; S.ob.dir = 'next'; obAnimate(); window.scrollTo(0, 0); render(); obFocus(); return; }
  finishOnboarding();
}
function obBack(){ if (S.ob.q > 0) { obSave(); S.ob.q--; S.ob.tried = false; S.ob.dir = 'back'; obAnimate(); window.scrollTo(0, 0); render(); } }
// The card slides in only when the question changes, not on every tap.
function obAnimate(){ S.ob.anim = true; setTimeout(() => { if (S.ob) S.ob.anim = false; }, 400); }
// From the finish screen: back to the first required answer that's missing.
function obFix(){
  const list = obVisible(), k = list.findIndex(q => q.need && obMissing(q));
  S.obDone = false; S.ob.q = Math.max(0, k); S.ob.dir = 'back'; obAnimate(); window.scrollTo(0, 0); render(); obFocus();
}
// Typing questions: put the cursor in the first box straight away.
function obFocus(){ setTimeout(() => { const sc = obVisible()[S.ob?.q], first = sc && obParts(sc)[0]; if (!first || !['numbers','texts','text','textarea'].includes(first.type)) return; document.querySelector('.ob-qbody input, .ob-qbody textarea')?.focus(); }, 60); }

async function finishOnboarding(){
  obSave();
  if (!S.profile.onboarded) { S.profile.onboarded = true; S.profile.onboardedAt = dkey(); }
  S.profile.targets = null; S.profile.targetsSource = null; // fresh on-device estimate until the review says otherwise
  S.obDone = true; S.ob.review = null; save.profile(); window.scrollTo(0, 0); render();
  if (!S.sampleOK) { S.ob.review = { error:'Sign in to get your dietitian\'s notes.' }; render(); return; }
  const t = targets();
  if (!t) { S.ob.review = { error:'Add the missing answers and I\'ll review everything.' }; render(); return; }
  try {
    const r = await S.sample.json(PROMPTS.onboardingReview(S.profile.data, t && { kcal:t.kcal, protein:t.protein, carbs:t.carbs, fat:t.fat, fiber:t.fiber, maintenance_kcal:t.tdee, strategy:t.strategy, why:t.why }), { modelTier:'default' });
    if (isObj(r?.assessment)) S.profile.assessment = { ...r.assessment, at:dkey() };
    if (isObj(r?.targets) && r.targets.kcal) { S.profile.targets = { kcal:r0(r.targets.kcal), protein:r0(r.targets.protein), carbs:r0(r.targets.carbs), fat:r0(r.targets.fat), fiber:r0(r.targets.fiber) }; S.profile.targetsSource = 'coach'; }
    if (isObj(r?.focus) && r.focus.weak_point) S.profile.focus = { weak_point:String(r.focus.weak_point), why:String(r.focus.why || ''), tips:(Array.isArray(r.focus.tips) ? r.focus.tips : []).slice(0,5).map(String), at:dkey() };
    if (r?.medical_flag) S.profile.flags = [...new Set([...(S.profile.flags || []), String(r.medical_flag)])].slice(-5);
    const summary = String(r?.summary || '').trim();
    if (S.ob) S.ob.review = { summary, flag: r?.medical_flag || null, assessment: isObj(r?.assessment) ? r.assessment : null };
    // The review also opens today's conversation in the Dietitian tab.
    if (summary) {
      S.chat.start = S.chat.turns.length;
      S.chat.turns.push({ role:'assistant', content:summary, quick:(Array.isArray(r.quick_replies) ? r.quick_replies : []).slice(0,4).map(String), flag:r?.medical_flag || null, at:Date.now() });
      save.chat();
    }
    save.profile();
  } catch (e) { hardFail(e); if (S.ob) S.ob.review = { error: errText(e) }; }
  render();
}
function closeOnboarding(){ S.ob = null; S.obDone = false; S.view = 'today'; window.scrollTo(0, 0); render(); }

// === views/shell.js ===
// Top-level render: sign-in gate, nav tabs, current view, shared banners
function render(){
  const authed = S.auth.status === 'signed-in';
  document.body.classList.toggle('signed-out', !authed);
  if (S.view !== 'coach' && S.aboutOpen) { S.aboutOpen = null; document.body.classList.remove('sheet-open'); }
  if (!authed) { $('#tabs').innerHTML = ''; $('#view').innerHTML = vAuth(); restoreAuthDraft(); return; }
  document.body.classList.toggle('onboarding', !!S.ob);
  document.body.dataset.sec = S.ob && !S.obDone ? (obVisible()[Math.min(S.ob.q, obVisible().length - 1)]?.sec || '') : '';
  if (S.ob) { $('#tabs').innerHTML = ''; $('#view').innerHTML = S.obDone ? vObDone() : vOnboarding(); document.querySelectorAll('textarea.grow').forEach(growBox); return; }
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" data-act="nav" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${ICONS[k]}<span>${l}</span></button>`).join('');
  $('#railFoot').innerHTML = `<span class="muted">${esc(S.auth.email || '')}</span><button class="btn ghost small" data-act="signout">Sign out</button>`;
  if (S.view === 'coach' && !S.busy.chat) maybeNewSession();
  const v = { today:vToday, coach:vCoach, plan:vPlan, shop:vShop, progress:vProgress }[S.view]();
  const view = $('#view');
  if (render.last !== S.view) { render.last = S.view; view.classList.add('entering'); clearTimeout(render.t); render.t = setTimeout(() => view.classList.remove('entering'), 400); }
  view.innerHTML = v + (S.toast ? `<div class="toast" role="status"><span>${esc(S.toast)}</span>${S.toastUndo ? '<button data-act="undo">Undo</button>' : ''}</div>` : '');
  if (S.view === 'coach') scrollChat();
  const lt = $('#logText'); if (lt) lt.value = S.draft.log;
  const ct = $('#chatText'); if (ct) { ct.value = S.draft.chat; fitChatBox(); }
  document.body.classList.toggle('on-coach', S.view === 'coach');
  document.body.classList.toggle('on-today', S.view === 'today');
  if (S.view === 'plan') keepDayInView();
  if (S.view !== 'progress' && S.ckSheet) { S.ckSheet = null; document.body.classList.remove('sheet-open'); }
  if (S.view !== 'shop' && S.storeSheet) { S.storeSheet = null; document.body.classList.remove('sheet-open'); }
  if (S.view !== 'plan' && S.planSheet) { S.planSheet = null; document.body.classList.remove('sheet-open'); }
  if (S.view === 'plan' && S.plan?.days) loadDayPhotos(Math.min(S.planDay, S.plan.days.length - 1));
  const at = $('#askText'); if (at) at.value = S.draft.ask;
}

function statusBanner(){

  if (S.saveError) return `<div class="notice warn">Couldn't save to your account just now. Your changes are kept on this device; they sync on the next save.</div>`;
  return '';
}

// === views/today.js ===
// Today: calorie ring, macros, focus tips, food logging, streak
function vToday(){
  const day = vday(), isToday = day === dkey(), t = targets(), log = S.logs[day] || {items:[]}, eaten = sumItems(log.items);
  const kcalT = t?.kcal || 0, left = kcalT - eaten.kcal, pct = kcalT ? Math.min(eaten.kcal / kcalT, 1) : 0;
  const C = 2 * Math.PI * 78;
  const now = new Date();
  const overdue = S.profile.onboarded && (() => { const last = S.progress.checkins.slice(-1)[0]?.date || S.profile.onboardedAt; return last && daysBetween(last, dkey()) >= 7; })();
  const bar = (label, val, tgt, color) => `<div class="macro"><div class="top"><b>${label}</b><span class="num">${r0(val)}${tgt ? ` <span class="muted">/ ${tgt} g</span>` : ' g'}</span></div><div class="bar"><span style="width:${tgt ? Math.min(val/tgt*100,100) : 0}%;background:${color}"></span></div></div>`;
  return `
  <div class="head today-head"><h1>${isToday ? 'Today' : fromKey(day).toLocaleDateString(undefined,{weekday:'long'})}</h1>
  ${streakPill(day)}</div>
  ${statusBanner()}
  ${!S.profile.onboarded ? `<div class="notice accent row" style="justify-content:space-between"><span><b>Set up your plan.</b> A few quick questions about you, your routine and the food you like. About 3 minutes.</span><button class="btn primary small" data-act="startob">Start</button></div>` : ''}
  ${overdue ? `<div class="notice accent row" style="justify-content:space-between"><span><b>It's check-in week.</b> A two-minute follow-up so your plan keeps fitting your life.</span><button class="btn primary small" data-act="startcheckin">Check in</button></div>` : ''}
    <section class="card hero balance" aria-label="Calories and macros">
      <div class="bal-top">
        <div class="bal-main">
          ${t ? `<span class="bal-num num">${Math.abs(left).toLocaleString()}</span><span class="bal-unit">${left >= 0 ? (isToday ? 'kcal left' : 'kcal under target') : 'kcal above target'}</span>
          <span class="bal-sub num">${eaten.kcal.toLocaleString()} eaten · ${kcalT.toLocaleString()} goal <span class="est" title="${S.profile.targets ? 'Targets set with your dietitian' : 'Mifflin-St Jeor estimate from your profile'}">est.</span></span>`
          : `<span class="bal-num num">${eaten.kcal.toLocaleString()}</span><span class="bal-unit">kcal eaten</span><span class="bal-sub">Targets appear after your setup.</span>`}
        </div>
        <div class="mini-ring" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--hero-track)" stroke-width="8"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${2 * Math.PI * 26}" stroke-dashoffset="${2 * Math.PI * 26 * (1 - pct)}" transform="rotate(-90 32 32)"/></svg><span class="num">${Math.round(pct * 100)}%</span></div>
      </div>
      <div class="mac-row">
        ${[['Protein', eaten.protein, t?.protein, 'var(--pink)'], ['Carbs', eaten.carbs, t?.carbs, 'var(--amber)'], ['Fat', eaten.fat, t?.fat, 'var(--blue)'], ['Fiber', eaten.fiber, t?.fiber, 'var(--accent)']].map(([l, v, g, c]) => `<div class="mac"><span class="mac-l">${l}</span><span class="mac-v num">${r0(v)}<small>${g ? '/' + g : ''} g</small></span><span class="mac-bar"><i style="width:${g ? Math.min(v / g * 100, 100) : 0}%;background:${c}"></i></span></div>`).join('')}
      </div>
    </section>
  ${mealsSection(t)}
  ${S.sheet ? logSheet() : ''}
`;
}

const MEAL_SHARE = { Breakfast:.25, Lunch:.35, Snack:.10, Dinner:.30 };

const mealIcon = s => `<span class="meal-ic" style="--c:${MEAL_COLOR[s]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${MEAL_ICON[s]}</svg></span>`;

function mealsSection(t){
  const items = S.logs[vday()]?.items || [];
  return `<section class="card meals" aria-label="Meals">
    ${SLOTS.map(s => {
      const its = items.filter(i => i.slot === s), k = sumItems(its).kcal, open = S.openMeal === s;
      const sub = its.length ? `${k} kcal · ${its.length} item${its.length > 1 ? 's' : ''}` : t ? `Suggested ~${Math.round(t.kcal * MEAL_SHARE[s] / 10) * 10} kcal` : 'Nothing yet';
      return `<div class="meal-row ${its.length ? 'has' : ''}">
        <button class="meal-main" data-act="togglemeal" data-s="${s}" ${its.length ? `aria-expanded="${open}"` : 'disabled'}>
          ${mealIcon(s)}<span class="meal-txt"><b>${s}${its.length ? `<svg class="chev ${open ? 'up' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>` : ''}</b><span>${sub}</span></span>
        </button>
        <button class="addbtn" data-act="openlog" data-s="${s}" aria-label="Add food to ${s}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        ${open && its.length ? `<div class="meal-list">

}

// One short, timely tip instead of a big static card. Picked on the device from
// the time of day, the day of the week and what's been eaten: no AI call.
function smartTip(){
  const t = targets(), items = S.logs[dkey()]?.items || [], eaten = sumItems(items); // tips are always about today
  const now = new Date(), h = now.getHours(), dow = now.getDay(), weekend = dow === 0 || dow === 6 || (dow === 5 && h >= 16);
  const f = S.profile.focus, dayN = Math.floor(now / 864e5);
  const pick = arr => arr[dayN % arr.length];
  const pLeft = t ? t.protein - eaten.protein : 0, kLeft = t ? t.kcal - eaten.kcal : 0;
  if (!t) return null;
  if (t && kLeft < -150) return { title:'A little above today\'s target', text:'Totally fine once in a while. A lighter, veggie-heavy next meal keeps the week balanced.', q:'I went a bit over my calories today. What would be a good light next meal?' };
  if (f && weekend && f.tips?.length) return { title:`Weekend focus: ${f.weak_point}`, text: pick(f.tips), q:`It's the weekend. Help me with my weak point (${f.weak_point}) today.` };
  if (h >= 16 && pLeft > 30) return { title:`${r0(pLeft)} g protein to go`, text:`About ${pLeft > 45 ? 'two palm-sized portions' : 'a palm-sized portion'} of chicken, fish, tofu or Greek yogurt at dinner gets you there.`, q:`I still need about ${r0(pLeft)} g protein today. What could I have?` };
  if (!items.length && h < 11) return { title:'Start with breakfast', text:'Logging as you eat takes seconds; remembering later is harder.', q:'Give me a quick breakfast idea that fits my targets.' };
  if (h >= 14 && t.fiber && eaten.fiber < t.fiber * 0.4) return { title:'Room for more fibre', text:'Beans, lentils, berries, oats or a big side of veg all help, and keep you full.', q:'How can I add more fibre to the rest of today?' };
  if (f?.tips?.length) return { title:`Your focus: ${f.weak_point}`, text: pick(f.tips), q:`Let's talk about my weak point (${f.weak_point}). What else could help?` };
  if (!f && S.profile.onboarded) return { title:'What holds you back most?', text:'Weekends, evenings, eating out… tell your dietitian and the plan will work around it.', q:'I want to talk about what I think holds me back.' };
  return null;
}
function focusCard(){
  const tip = smartTip(); if (!tip) return '';
  try { if (localStorage.getItem(LS + 'tipHidden') === dkey()) return ''; } catch {}
  return `<div class="tipline">
    <button class="tipline-main" data-act="askquick" data-q="${esc(tip.q)}" aria-label="${esc(tip.title)}. ${esc(tip.text)} Ask your dietitian">
      <span class="tip-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span>
      <span class="tip-txt"><b>${esc(tip.title)}</b><span>${esc(tip.text)}</span></span>
    </button>
    <button class="x small-x" data-act="hidetip" aria-label="Hide tips for today">×</button>
  </div>`;
}

// "x/7 days logged" with the week's days as circles (green = logged).
// Tap a circle to open that day; the dark ring marks the day shown.
// The small arrows move a week back or forward.
function streakPill(day){
  const today = dkey(), days = new Set(S.profile.loggedDays || []), mon = fromKey(mondayOf(fromKey(day)));
  const cells = DAYS.map((l, i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return { l, k:dkey(d) }; });
  const week = cells.filter(c => days.has(c.k)).length, thisWeek = cells.some(c => c.k === today);
  const dots = cells.map(c => `<button class="${days.has(c.k) ? 'on' : ''}" data-act="gotoday" data-k="${c.k}" aria-pressed="${c.k === day}" ${c.k > today ? 'disabled' : ''} aria-label="${fromKey(c.k).toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'})}${days.has(c.k) ? ', logged' : ''}">${c.l[0]}</button>`).join('');
  return `<div class="streak" aria-label="${week} of 7 days logged ${thisWeek ? 'this week' : 'that week'}">
    <div><div class="n">${week}<span class="muted" style="font-size:.9rem;font-weight:700">/7</span></div><div class="label" style="font-size:.7rem">days logged</div></div>
    <div class="week-nav"><button class="wk-arrow" data-act="prevweek" aria-label="Previous week">‹</button><div class="week-dots">${dots}</div><button class="wk-arrow" data-act="nextweek" aria-label="Next week" ${thisWeek ? 'disabled' : ''}>›</button></div>
  </div>`;
}

function vCoach(){
  const all = S.chat.turns.length ? S.chat.turns : [{ role:'assistant', content:greeting() }];
  const start = S.chat.history ? 0 : Math.min(S.chat.start || 0, all.length - 1);
  const turns = all.slice(start), last = all[all.length - 1];
  const done = SECTIONS.filter(([k]) => sectionDone(k)).length;
  const status = S.profile.onboarded ? 'Follow-up' : `Consultation · ${done}/${SECTIONS.length}`;
  const aiRow = (inner) => `<div class="msg-row"><span class="ai-dot mascot" aria-hidden="true">${MASCOT}</span><div class="msg ai">${inner}</div></div>`;
  const enter = S.aboutOpen === 'enter' ? ' enter' : '';
  return `
  <div class="coach">
    <section class="card chat" aria-label="Conversation with your dietitian">
      <header class="chat-head">
        <span class="ai-avatar mascot" aria-hidden="true">${MASCOT}</span>
        <div class="chat-title"><b>${esc(coachName())}</b><span>${S.busy.chat ? 'Typing…' : status}</span></div>
        <button class="newchat-btn" data-act="newchat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
        <button class="iconbtn2 about-btn" data-act="about" aria-label="About you" title="About you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
      </header>
      ${!S.profile.onboarded ? `<div class="consult-bar" aria-hidden="true"><span style="width:${Math.max(4, done / SECTIONS.length * 100)}%"></span></div>` : ''}
      <div class="msgs" aria-live="polite">
        ${statusBanner()}
        ${start > 0 ? `<button class="earlier" data-act="history">Show earlier messages</button>` : ''}
        ${turns.map(m => m.role === 'user' ? `<div class="msg me">${esc(m.content)}</div>` :
          aiRow(`${md(m.content)}${m.flag ? `<div class="flag"><span class="tag med">Needs medical review</span> ${esc(m.flag)}</div>` : ''}${m.logged ? `<div class="logged">✓ Added ${m.logged} item${m.logged > 1 ? 's' : ''} to today's meals</div>` : ''}`)).join('')}
        ${S.busy.chat ? (S.chat.live ? `<div class="msg-row"><span class="ai-dot mascot" aria-hidden="true">${MASCOT}</span><div class="msg ai" id="liveMsg">${md(S.chat.live)}</div></div>` : aiRow(`<span class="typing" aria-label="Thinking"><span></span><span></span><span></span></span>`)) : ''}
      </div>
      ${!S.busy.chat && last.role === 'assistant' && last.done ? `<div class="wrapup"><button class="btn ghost small" data-act="newchat">Start a new chat</button></div>` : ''}
      ${!S.busy.chat && last.role === 'assistant' && last.quick?.length ? `<div class="quick">${last.quick.map(q => `<button class="chip" data-act="quick" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : ''}
      ${S.err.chat ? `<div class="notice warn chat-err">${esc(S.err.chat)}</div>` : ''}
      <div class="chatbar">
        <textarea id="chatText" rows="1" placeholder="Message your dietitian" aria-label="Message your dietitian"></textarea>
        <button class="sendbtn" data-act="send" aria-label="Send" ${S.busy.chat ? 'disabled' : ''}>${SEND}</button>
      </div>
    </section>
    <aside class="stack about-side">${aboutYou(done)}</aside>
  </div>
  ${S.aboutOpen ? `<div class="scrim${enter}" data-act="about"></div><div class="sheet${enter}" role="dialog" aria-modal="true" aria-label="About you"><div class="grip" aria-hidden="true"></div><div class="sheet-head"><h2>About you</h2><button class="x close" data-act="about" aria-label="Close">×</button></div>${aboutYou(done)}</div>` : ''}`;
}

function aboutYou(done){
  const t = targets(), d = S.profile.data, b = d.basics || {};
  return `
      <section class="card stack">
        <div class="row" style="justify-content:space-between"><h3>What I know about you</h3><span class="num muted" style="font-size:.85rem">${done}/${SECTIONS.length}</span></div>
        <div class="progressbar"><span style="width:${done / SECTIONS.length * 100}%"></span></div>
        <div class="sections">${SECTIONS.map(([k, l]) => `<div class="sec"><span class="dot ${sectionDone(k) ? 'on' : ''}"></span>${l}</div>`).join('')}</div>
      </section>
      <section class="card stack">
        <div class="row" style="justify-content:space-between"><h3>Daily targets</h3><span class="tag est">Estimated</span></div>
        ${t ? `<dl class="kv"><dt>Energy</dt><dd>${t.kcal} kcal</dd><dt>Protein</dt><dd>${t.protein} g</dd><dt>Carbs</dt><dd>${t.carbs} g</dd><dt>Fat</dt><dd>${t.fat} g</dd><dt>Fiber</dt><dd>${t.fiber} g</dd>${t.tdee ? `<dt>BMR / TDEE</dt><dd>${t.bmr} / ${t.tdee}</dd>` : ''}</dl>
        <p class="muted" style="font-size:.8rem">${S.profile.targets ? 'Set during your consultation.' : 'Mifflin-St Jeor, adjusted for activity and goal. Real needs vary; we refine from your weight trend.'}</p>` : `<p class="muted" style="font-size:.88rem">Appear once I know your age, sex, height, weight and goal.</p>`}
        ${b.weight_kg ? `<dl class="kv"><dt>Weight</dt><dd>${esc(b.weight_kg)} kg</dd>${b.goal ? `<dt>Goal</dt><dd>${esc(b.goal)}</dd>` : ''}${d.shopping?.supermarkets ? `<dt>Shops at</dt><dd>${esc(d.shopping.supermarkets)}</dd>` : ''}</dl>` : ''}
      </section>
      ${S.profile.flags?.length ? `<section class="card stack"><span class="tag med">Needs medical review</span>${S.profile.flags.map(f => `<p style="font-size:.88rem">${esc(f)}</p>`).join('')}<p class="muted" style="font-size:.8rem">Forkcast helps organise everyday eating. Changes for these points are best agreed with your doctor or a registered dietitian.</p></section>` : ''}
      <section class="stack" style="padding:0 4px">
        <section class="card stack"><h3>Your dietitian</h3>
          <div class="field"><label for="coachName">Name</label><input type="text" id="coachName" value="${esc(coachName())}" maxlength="20" autocomplete="off"></div>
          <div class="ob-chips">${COACH_TONES.map(([v, l]) => `<button class="chip" data-act="coachtone" data-v="${v}" aria-pressed="${coachTone()[0] === v}">${l}</button>`).join('')}</div>
        </section>
        <button class="btn small" data-act="editob">Edit my answers</button>
        <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:.85rem">Signed in as ${esc(S.auth.email || '')}</span><button class="btn ghost small" data-act="signout">Sign out</button></div>
        ${S.confirmReset ? `<div class="notice warn stack"><b>Erase everything?</b><span style="font-size:.88rem">Profile, conversation, plan, meals and progress are deleted.</span><div class="row"><button class="btn small" data-act="reset-yes">Erase</button><button class="btn ghost small" data-act="reset-no">Keep</button></div></div>` : `<button class="btn ghost small" data-act="reset">Start over</button>`}

// Grow the message box with its text, up to about five lines.
function fitChatBox(){
  const t = $('#chatText'); if (!t) return;
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 132) + 'px';
  t.style.overflowY = t.scrollHeight > 132 ? 'auto' : 'hidden';
}

// === views/plan.js ===
// Week plan: a slim day picker that keeps the chosen day in view, the day's
// meals as one-line rows, and the details (portion, swap, recipe) in a sheet.
function vPlan(){
  const head = `<div class="head"><div><div class="label">${S.plan ? `Week of ${fromKey(S.plan.weekOf).toLocaleDateString(undefined,{day:'numeric',month:'long'})}` : 'Seven days, prepped ahead'}</div><h1>Week plan</h1></div>
    <button class="btn ${S.plan ? 'small' : 'primary'}" data-act="genplan" ${S.busy.plan ? 'disabled' : ''}>${S.busy.plan ? `<span class="spinner"></span> ${esc(S.busy.plan)}` : S.plan ? '↻ New week' : 'Plan my week'}</button></div>`;
  const notes = `${statusBanner()}${S.err.plan ? `<div class="notice warn">${esc(S.err.plan)}</div>` : ''}${!S.profile.onboarded && !S.plan ? `<div class="notice accent">Your plan is built from your consultation. Finish it first for a plan that fits your tastes, schedule and supermarket. You can still plan now with what's known.</div>` : ''}`;
  if (!S.plan?.days) return head + notes + `<section class="card empty"><div class="blob" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div><h2>No plan yet</h2><p>Forkcast writes seven days of meals around the food you like, your targets and how often you want to cook, then turns them into one shopping list.</p></section>`;
  const di = Math.min(S.planDay, S.plan.days.length - 1), day = S.plan.days[di], t = targets();
  const tot = day.meals.reduce((a, m) => ({kcal:a.kcal+r0(m.kcal), p:a.p+r0(m.p), c:a.c+r0(m.c), f:a.f+r0(m.f)}), {kcal:0,p:0,c:0,f:0});
  const mon = fromKey(S.plan.weekOf), todayIdx = (new Date().getDay() + 6) % 7, thisWeek = S.plan.weekOf === mondayOf();
  const chevron = '<svg class="tip-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  return head + notes + `
  ${S.plan.grocery?.length ? '' : `<button class="tipcard" data-act="nav" data-v="shop"><span class="tip-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.3 11.2a1 1 0 0 1-1 .8H7.3a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span><span class="tip-txt"><b>Create your shopping list</b><span>One list for the whole week, for your supermarket.</span></span>${chevron}</button>`}
  <div class="daypick" role="tablist" aria-label="Day">${S.plan.days.map((d, i) => { const date = new Date(mon); date.setDate(date.getDate() + i); return `<button class="dp" role="tab" data-act="day" data-i="${i}" aria-selected="${i === di}"><span>${esc(d.day)}</span><b>${date.getDate()}</b>${thisWeek && i === todayIdx ? '<i aria-label="today"></i>' : ''}</button>`; }).join('')}</div>
  <section class="card plan-day">
    <div class="day-sum"><b class="num">${tot.kcal.toLocaleString()} kcal</b>${pfc(tot)}</div>
    ${day.meals.map((m, j) => `<button class="prow" data-act="planmeal" data-i="${di}" data-j="${j}">
      ${SLOTS.includes(m.slot) ? mealIcon(m.slot) : ''}
      <span class="prow-txt"><span class="label">${esc(m.slot)} · ${m.prep === 'fresh' ? 'cook fresh' : 'prepped'}</span><b>${esc(m.name)}</b></span>
      <span class="num">${r0(m.kcal)}</span>${chevron}
    </button>`).join('')}
  </section>
  ${S.plan.notes ? `<details class="plan-notes"><summary>How this week works</summary><p>${esc(S.plan.notes)}</p></details>` : ''}
  ${S.planSheet ? planMealSheet() : ''}`;
}

function planMealSheet(){
  const { i, j } = S.planSheet, m = S.plan.days[i]?.meals[j]; if (!m) return '';
  const key = i + '-' + j, rec = S.plan.recipes?.[key], enter = S.planSheet.enter ? ' enter' : '';
  return `<div class="scrim${enter}" data-act="closeplan"></div>
  <div class="sheet${enter}" role="dialog" aria-modal="true" aria-label="${esc(m.name)}">
    <div class="grip" aria-hidden="true"></div>
    <div class="sheet-head">${SLOTS.includes(m.slot) ? mealIcon(m.slot) : ''}<div style="min-width:0"><div class="label">${esc(S.plan.days[i].day)} · ${esc(m.slot)}</div><h2>${esc(m.name)}</h2></div><button class="x close" data-act="closeplan" aria-label="Close">×</button></div>
    ${dishPhoto(key, m)}
    <div class="review-total"><span class="big num">${r0(m.kcal)}</span><span class="muted">kcal</span><span class="pfc" style="margin-left:auto">${pfc(m)}</span></div>
    <dl class="facts"><dt>Portion</dt><dd>${esc(m.portion)}</dd>${m.swap ? `<dt>Swap</dt><dd>${esc(m.swap)}</dd>` : ''}</dl>
    ${rec ? `<details class="plan-notes" open><summary>Recipe${rec.time ? ' · ' + esc(rec.time) : ''}</summary><div class="recipe-body"><div class="label">Ingredients</div><ul>${(rec.ingredients || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="label">Method</div><ol>${(rec.steps || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>${rec.storage ? `<p class="muted">${esc(rec.storage)}</p>` : ''}</div></details>`
      : `<button class="btn" data-act="recipe" data-k="${key}" data-i="${i}" data-j="${j}" ${S.busy.recipe === key ? 'disabled' : ''}>${S.busy.recipe === key ? '<span class="spinner"></span> Writing the recipe…' : 'Show recipe'}</button>`}
    <div class="sheet-actions"><button class="btn primary big-btn" data-act="logmeal" data-i="${i}" data-j="${j}">I ate this</button></div>
  </div>`;
}

function dishPhoto(key, m){
  const p = S.plan.photos?.[key];
  if (!p) return '';
  return `<figure class="dish"><img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy"><figcaption><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.by)} · Pexels</a></figcaption></figure>`;
}

// Keep the chosen day visible in the day picker after every redraw.
function keepDayInView(){
  const el = document.querySelector('.dp[aria-selected="true"]'); if (!el) return;
  const row = el.parentElement;
  row.scrollLeft = el.offsetLeft - row.offsetLeft - (row.clientWidth - el.offsetWidth) / 2;
}

// === views/shop.js ===
// Shop & prep: the list first (what's left to buy), ticked items fold away,
// supermarket as a small switch, prep plan on its own tab, cost at the bottom.
const CART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.3 11.2a1 1 0 0 1-1 .8H7.3a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';

function vShop(){
  const store = S.plan?.store || (S.plan?.grocery?.length ? storeOptions()[0] : ''), err = S.err.shop ? `<div class="notice warn">${esc(S.err.shop)}</div>` : '';
  const head = (sub) => `<div class="head"><div><div class="label">${sub}</div><h1>Shop & prep</h1></div>
    ${S.plan?.grocery?.length ? `<button class="store-btn" data-act="storesheet" aria-label="Shopping at ${esc(store || 'no supermarket yet')}. Change">${CART}<span><small>Shopping at</small>${esc(store || 'Choose store')}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>` : ''}</div>`;
  if (!S.plan?.days) return head('One trip, one prep session') + `<section class="card empty"><div class="blob" aria-hidden="true">${CART}</div><h2>No list yet</h2><p>Plan your week first. Then Forkcast turns it into one shopping list for your supermarket.</p><button class="btn primary" data-act="nav" data-v="plan">Plan my week</button></section>`;
  if (S.busy.shop) return head('Writing your list') + `<section class="card empty"><div class="blob pulse-blob" aria-hidden="true">${CART}</div><h2>Writing your list…</h2><p>Adding up every ingredient in your week${S.shopStore ? ` for ${esc(S.shopStore)}` : ''}.</p></section>`;
  if (!S.plan.grocery?.length) return head('One trip, one prep session') + err + askForList();

  const tab = S.shopTab || 'list';
  const ch = S.plan.checked || {}, extra = S.plan.extra || [];
  const rows = [
    ...extra.map(x => ({ k:'x-' + x.id, group:'My items', name:x.name, qty:'', note:'', done:!!x.done, mine:true })),
    ...S.plan.grocery.flatMap((g, gi) => (g.items || []).map((it, ii) => ({ k:gi + '-' + ii, group:g.group, name:it.name, qty:it.qty, note:it.note, done:!!ch[gi + '-' + ii] })))
  ];
  const todo = rows.filter(r => !r.done), done = rows.filter(r => r.done);
  const groups = [...new Set(todo.map(r => r.group))];
  const row = r => `<div class="gi ${r.done ? 'done' : ''}"><label><input type="checkbox" data-act="check" data-k="${r.k}" ${r.done ? 'checked' : ''}><span class="gname">${esc(r.name)}</span></label><span class="gq">${esc(r.qty || '')}</span>${r.mine ? `<button class="x small-x" data-act="delextra" data-k="${r.k}" aria-label="Remove ${esc(r.name)}">×</button>` : ''}</div>`;

  return head(`${todo.length ? `${todo.length} to buy` : 'All in the basket'}`) + err + `
  <div class="seg" role="tablist" aria-label="Shop & prep">
    <button role="tab" data-act="shoptab" data-t="list" aria-selected="${tab === 'list'}">List <span class="num">${todo.length}</span></button>
    <button role="tab" data-act="shoptab" data-t="prep" aria-selected="${tab === 'prep'}">Prep plan</button>
  </div>
  ${tab === 'list' ? `
  <section class="card shoplist">
    <div class="basket"><div class="basket-bar"><span style="width:${rows.length ? done.length / rows.length * 100 : 0}%"></span></div><span class="muted num">${done.length}/${rows.length}</span></div>
    <form class="additem" id="addItemForm"><input type="text" id="extraName" placeholder="Add an item, e.g. coffee" aria-label="Add an item" autocomplete="off"><button class="sendbtn" type="submit" aria-label="Add item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></form>
    ${groups.map(g => `<div class="grp"><h3>${esc(g)}</h3>${todo.filter(r => r.group === g).map(row).join('')}</div>`).join('')}
    ${!todo.length ? `<div class="empty" style="padding:18px 0"><h3>All done</h3><p>Everything's in the basket.</p></div>` : ''}
    ${done.length ? `<details class="basket-done"><summary>In the basket · ${done.length}</summary>${done.map(row).join('')}<button class="btn ghost small" data-act="clearchecks">Untick all</button></details>` : ''}
  </section>
  ${S.plan.budget_note ? `<p class="foot-note"><span class="tag est">Estimated</span> ${esc(S.plan.budget_note)} Products and prices for ${esc(store || 'your supermarket')} are estimates, not checked live.</p>` : ''}`
  : prepPlan()}
  ${S.storeSheet ? storeSheet() : ''}`;
}

function prepPlan(){
  const prep = S.plan.prep || [];
  if (!prep.length) return `<section class="card empty"><h2>No prep plan</h2><p>Rebuild your list to get a prep schedule with it.</p></section>`;
  return `<div class="stack">${prep.map(p => `<section class="card prep">
    <div class="row" style="justify-content:space-between"><h2>${esc(p.when)}</h2>${p.minutes ? `<span class="trend-pill">${esc(p.minutes)}</span>` : ''}</div>
    <ol class="steps">${(p.tasks || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>
    ${p.fridge || p.freeze || p.fresh ? `<details class="plan-notes"><summary>Storage</summary><dl class="facts" style="margin-top:8px">${p.fridge ? `<dt>Fridge</dt><dd>${esc(p.fridge)}</dd>` : ''}${p.freeze ? `<dt>Freeze</dt><dd>${esc(p.freeze)}</dd>` : ''}${p.fresh ? `<dt>Fresh</dt><dd>${esc(p.fresh)}</dd>` : ''}</dl></details>` : ''}
  </section>`).join('')}</div>`;
}

    <div class="asker"><span class="ai-avatar mascot" aria-hidden="true">${MASCOT}</span><div class="bubble">Your week is planned. Shall I create your shopping list?</div></div>
    <div><div class="label" style="margin-bottom:8px">Where are you shopping?</div>${storeChips(S.shopStore || S.plan?.store || storeOptions()[0])}</div>

// === views/progress.js ===
// Weight chart, weigh-ins and weekly check-in
function weightChart(){
  const w = [...S.progress.weighins].sort((a, b) => a.date.localeCompare(b.date));
  if (w.length < 2) return `<div class="empty" style="padding:24px"><p>${w.length ? 'One weigh-in so far. Add a few more and the trend line appears; one reading on its own says little.' : 'Add your first weigh-in. Weighing 2–3 times a week, same time of day, gives a trend worth reading.'}</p></div>`;
  const W = 360, H = 190, L = 38, R = 12, T = 12, B = 26;
  const t0 = fromKey(w[0].date).getTime(), t1 = Math.max(fromKey(w[w.length-1].date).getTime(), t0 + 864e5);
  const vals = w.map(x => +x.weight); let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, 0.5); lo = Math.floor((lo - pad) * 2) / 2; hi = Math.ceil((hi + pad) * 2) / 2;
  const X = d => L + (fromKey(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const avg = w.map(x => { const win = w.filter(y => daysBetween(y.date, x.date) >= 0 && daysBetween(y.date, x.date) < 7); return { date:x.date, v: win.reduce((a, y) => a + +y.weight, 0) / win.length }; });
  const ticks = [lo, (lo + hi) / 2, hi];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    ${ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11.5" fill="var(--muted)" font-family="Plus Jakarta Sans, system-ui, sans-serif">${v.toFixed(1)}</text>`).join('')}
    <text x="${L}" y="${H-8}" font-size="11.5" fill="var(--muted)" font-family="Plus Jakarta Sans, system-ui, sans-serif">${fromKey(w[0].date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</text>
    <text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11.5" fill="var(--muted)" font-family="Plus Jakarta Sans, system-ui, sans-serif">${fromKey(w[w.length-1].date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</text>
    <path d="M${avg.map(a => `${X(a.date)},${Y(a.v)}`).join(' L')} L${X(avg[avg.length-1].date)},${H-B} L${X(avg[0].date)},${H-B}Z" fill="var(--accent)" opacity=".08"/>
    <polyline points="${avg.map(a => `${X(a.date)},${Y(a.v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
    ${w.map(x => `<circle cx="${X(x.date)}" cy="${Y(+x.weight)}" r="3" fill="var(--muted)"/>`).join('')}
    <circle cx="${X(avg[avg.length-1].date)}" cy="${Y(avg[avg.length-1].v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
  </svg>
  <div class="row muted" style="font-size:.8rem"><span style="display:inline-block;width:14px;height:3px;background:var(--accent)"></span>7-day average <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-left:10px"></span>single weigh-ins</div>`;
}

function vProgress(){
  const w = [...S.progress.weighins].sort((a, b) => a.date.localeCompare(b.date));
  const avg = end => { const win = w.filter(y => { const d = daysBetween(y.date, end); return d >= 0 && d < 7; }); return win.reduce((a, y) => a + +y.weight, 0) / win.length; };
  const now = w.length ? avg(w[w.length - 1].date) : null;
  const diff = w.length > 1 ? now - +w[0].weight : null, span = w.length > 1 ? daysBetween(w[0].date, w[w.length - 1].date) : 0;
  const days = new Set(S.profile.loggedDays || []), mon = fromKey(mondayOf());
  const logged = DAYS.filter((l, i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return days.has(dkey(d)); }).length;
  const lastCk = S.progress.checkins.slice(-1)[0]?.date || S.profile.onboardedAt, ckIn = lastCk ? 7 - daysBetween(lastCk, dkey()) : 0;
  const tile = (label, value, sub, act) => `<${act ? `button class="tile tile-btn" data-act="${act}"` : 'div class="tile"'}><span class="label">${label}</span><b class="num">${value}</b><span class="muted">${sub}</span></${act ? 'button' : 'div'}>`;
  return `
  <div class="head"><div><div class="label">Trends over single readings</div><h1>Progress</h1></div></div>
  <div class="tiles">
    ${tile('Weight', now ? now.toFixed(1) + '<small> kg</small>' : '–', now ? '7-day average' : 'Log your first weigh-in')}
    ${tile('Change', diff === null ? '–' : (Math.abs(diff) < 0.1 ? 'Steady' : (diff < 0 ? '↓ ' : '↑ ') + Math.abs(diff).toFixed(1) + '<small> kg</small>'), diff === null ? 'Needs 2 weigh-ins' : `over ${span >= 14 ? Math.round(span / 7) + ' weeks' : span + ' days'}`)}
    ${tile('Logged', logged + '<small>/7</small>', 'days this week')}
    ${tile('Check-in', ckIn <= 0 ? 'Due' : `${ckIn}<small> day${ckIn > 1 ? 's' : ''}</small>`, ckIn <= 0 ? 'Tap to start' : 'until the next one', 'cksheet')}
  </div>
  <section class="card stack">
    <div class="row" style="justify-content:space-between"><h2>Weight trend</h2><span class="muted" style="font-size:.8rem">Trend matters more than one day</span></div>
    ${weightChart()}
  </section>

    <h2>Log weight</h2>
    <div class="weigh-row"><div class="unit-input"><input type="number" id="wKg" step="0.1" inputmode="decimal" aria-label="Weight in kg" value="${w.length ? w[w.length-1].weight : (S.profile.data.basics?.weight_kg || '')}"><span>kg</span></div><button class="btn primary" data-act="weigh">Save</button></div>
    <details class="plan-notes"><summary>Another day or add waist</summary>
      <div class="fields two" style="margin-top:10px"><div class="field"><label for="wDate">Date</label><input type="date" id="wDate" value="${dkey()}" max="${dkey()}"></div>
      <div class="field"><label for="wWaist">Waist (cm)</label><input type="number" id="wWaist" step="0.5" inputmode="decimal"></div></div>

}

// The answer first: current 7-day average and change since the first weigh-in.
function trendSummary(){
  const w = [...S.progress.weighins].sort((a, b) => a.date.localeCompare(b.date));
  if (w.length < 2) return '';
  const avg = end => { const win = w.filter(y => { const d = daysBetween(y.date, end); return d >= 0 && d < 7; }); return win.reduce((a, y) => a + +y.weight, 0) / win.length; };
  const now = avg(w[w.length - 1].date), first = +w[0].weight, diff = now - first, days = daysBetween(w[0].date, w[w.length - 1].date);
  const span = days >= 14 ? `${Math.round(days / 7)} weeks` : `${days} days`;
  const dir = Math.abs(diff) < 0.1 ? 'steady' : (diff < 0 ? '↓ ' : '↑ ') + Math.abs(diff).toFixed(1) + ' kg';
  return `<div class="trend-head"><span class="big num">${now.toFixed(1)}<span class="muted" style="font-size:1rem;font-weight:700"> kg</span></span><span class="trend-pill">${dir} in ${span}</span></div>
  <p class="muted" style="font-size:.82rem">7-day average. Day-to-day changes are mostly water, so the trend matters more than any single weigh-in.</p>`;
}
