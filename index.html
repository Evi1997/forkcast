<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forkcast</title>
<meta name="description" content="Your AI dietitian and meal-prep planner.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forkcast">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* === tokens.css === */
/* Forkcast design tokens.
   Identity: "fresh market" — deep basil green for actions, warm paprika for highlights,
   warm-neutral surfaces. Every text colour meets WCAG 2.2 AA (4.5:1) on its background. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F5F2; --ink:#10140F; --muted:#5F6474; --line:#E8EAE4;
  --accent:#1F7A4F; --accent-deep:#17603D; --accent-ink:#FFFFFF; --accent-soft:#E6F2EA;
  --paprika:#E8590C; --paprika-soft:#FDEDE4;
  /* macros: protein · carbs · fat (text-safe) */
  --pink:#C2255C; --amber:#A35200; --blue:#1864AB; --violet:#6741D9;
  --herb:var(--blue); --saffron:var(--amber); --sky:var(--accent);
  --warn:#9A4A00; --warn-soft:#FFF1DE;
  --hero:#10140F; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(16,20,15,.05), 0 8px 24px rgba(16,20,15,.06);
  --display:"Plus Jakarta Sans", "Avenir Next", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"Plus Jakarta Sans", system-ui, sans-serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D0B; --surface:#141714; --surface-2:#1D211C; --ink:#F1F4EF; --muted:#9AA095; --line:#262B25;
  --accent:#4CC38A; --accent-deep:#2F8F60; --accent-ink:#062012; --accent-soft:#12271C;
  --paprika:#FF8A4C; --paprika-soft:#2E1A10;
  --pink:#F06595; --amber:#FFA94D; --blue:#74C0FC; --violet:#B197FC;
  --warn:#FFC078; --warn-soft:#2A1E0E;
  --hero:#171B16; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.1);
  --shadow:0 0 0 1px rgba(255,255,255,.04); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D0B; --surface:#141714; --surface-2:#1D211C; --ink:#F1F4EF; --muted:#9AA095; --line:#262B25;
  --accent:#4CC38A; --accent-deep:#2F8F60; --accent-ink:#062012; --accent-soft:#12271C;
  --paprika:#FF8A4C; --paprika-soft:#2E1A10;
  --pink:#F06595; --amber:#FFA94D; --blue:#74C0FC; --violet:#B197FC;
  --warn:#FFC078; --warn-soft:#2A1E0E;
  --hero:#171B16; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.1);
  --shadow:0 0 0 1px rgba(255,255,255,.04); color-scheme:dark}

/* === base.css === */
/* Base elements, shell, cards, buttons, inputs */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(1.9rem,4.4vw,2.6rem);font-weight:800;line-height:1.05}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
.label{font-size:.78rem;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:28px 16px;display:flex;flex-direction:column;gap:30px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.04em;padding-left:10px}
.brand i{width:30px;height:30px;border-radius:10px;background:var(--accent);display:inline-block;box-shadow:inset 0 -2px 0 var(--accent-deep);position:relative}
.brand i::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--accent-ink);opacity:.9}
.tabs{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:16px;cursor:pointer;font-weight:700;color:var(--muted);text-align:left;transition:background .15s,color .15s}
.tab svg{width:22px;height:22px;flex:none}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-deep)}
:root[data-theme="dark"] .tab[aria-current="page"]{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-current="page"]{color:var(--accent)}}
.rail-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding-left:10px}

main{padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.view{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}

.card{background:var(--surface);border-radius:var(--r);padding:22px;min-width:0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* tactile buttons */
.btn{border:0;background:var(--surface-2);padding:11px 18px;border-radius:14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(16,20,15,.08);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--accent-deep);font-size:.95rem}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ink{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.small{padding:8px 13px;font-size:.84rem;border-radius:12px}
.btn.ghost{background:none;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.chip{border:2px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.88rem;font-weight:700;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--accent);color:var(--accent-deep)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:11px 14px;width:100%;min-width:0;font-weight:500}
textarea{resize:vertical;min-height:54px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--surface)}

/* Page reset (standalone app) */
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.rail-foot{display:flex;flex-direction:column;align-items:flex-start;gap:4px;word-break:break-all}

/* Sign-in */
.signed-out .app{grid-template-columns:minmax(0,1fr)}
.signed-out .rail{display:none}
.auth{max-width:440px;margin:6vh auto 0;width:100%;gap:18px;align-items:stretch}
section.auth:not(.card){display:flex;flex-direction:column;align-items:center;gap:20px}
.auth-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.5rem;letter-spacing:-.04em}
.auth-brand i{width:34px;height:34px;border-radius:11px;background:var(--accent);box-shadow:inset 0 -2px 0 var(--accent-deep);position:relative}
.auth-brand i::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--accent-ink);opacity:.9}
input[type=email],input[type=password]{background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:11px 14px;width:100%;min-width:0;font-weight:500}
input[type=email]:focus,input[type=password]:focus{outline:none;border-color:var(--blue);background:var(--surface)}
@media (pointer:coarse){input[type=email],input[type=password]{font-size:16px}}

/* === views.css === */
/* Per-view styles and responsive rules */
/* Today hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden;box-shadow:none}
.hero::before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 65%);opacity:.55;pointer-events:none}
.hero::after{content:"";position:absolute;width:300px;height:300px;left:-140px;bottom:-170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--paprika) 50%,transparent),transparent 65%);opacity:.45;pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .label,.hero .muted{color:rgba(255,255,255,.62)}
.hero .bar{background:var(--hero-track)}
.fuel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.ring{position:relative;width:184px;height:184px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:2.5rem;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.macros{display:flex;flex-direction:column;gap:14px}
.macro .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9rem}
.macro .top b{font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.streak{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}
.streak .flame{font-size:1.6rem;line-height:1}
.streak .n{font-size:1.4rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.week-dots{display:flex;gap:6px}
.week-dots span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.68rem;font-weight:800;background:var(--surface-2);color:var(--muted)}
.week-dots span.on{background:var(--accent);color:var(--accent-ink)}
.week-dots span.today{outline:2px solid var(--accent);outline-offset:2px}

/* dietitian bubble */
.avatar{width:44px;height:44px;border-radius:14px;background:var(--accent);flex:none}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.composer .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice{border-radius:18px;padding:14px 16px;background:var(--surface-2);font-size:.92rem}
.notice.warn{background:var(--warn-soft);color:var(--ink)}
.notice.accent{background:var(--accent-soft)}
.slot{display:flex;flex-direction:column}
.slot-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;margin-top:6px;border-radius:16px;background:var(--surface-2)}
.item .name{font-weight:700}
.item .meta{font-size:.82rem;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px;font-size:1.2rem;line-height:1}
.x:hover{color:var(--pink)}
.pfc{font-size:.76rem;color:var(--muted);white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.pfc .p{color:var(--pink)} .pfc .c{color:var(--amber)} .pfc .f{color:var(--blue)}

/* Coach */
.coach{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.chat{display:flex;flex-direction:column;height:min(74vh,780px);padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:13px 16px;border-radius:20px;line-height:1.55}
.msg.ai{background:var(--surface-2);border-top-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);border-top-right-radius:6px;align-self:flex-end;white-space:pre-wrap;font-weight:500}
.msg ul{margin:6px 0;padding-left:18px}
.msg .flag{margin-top:8px;font-size:.85rem;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--ink)}
.msg .logged{margin-top:8px;font-size:.82rem;color:var(--accent-deep);font-weight:800}
.msg .typing{display:inline-flex;gap:4px;padding:4px 0}
.msg .typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.msg .typing span:nth-child(2){animation-delay:.15s}.msg .typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 22px 12px}
.chat .composer{border-top:1px solid var(--line);padding:14px 16px}
.sections{display:flex;flex-direction:column;gap:2px}
.sec{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:.92rem;font-weight:600}
.progressbar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progressbar span{display:block;height:100%;background:var(--accent);border-radius:99px;box-shadow:inset 0 -2px 0 var(--accent-deep);transition:width .6s}
.dot{width:22px;height:22px;border-radius:50%;background:var(--surface-2);flex:none;display:grid;place-items:center}
.dot.on{background:var(--accent)}
.dot.on::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.tag.est{background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue)}
.hero .tag.est{background:rgba(255,255,255,.12);color:#fff}
.tag.med{background:var(--warn-soft);color:var(--warn)}

/* Plan */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.day-btn{flex:1 0 88px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px;cursor:pointer;text-align:left;transition:transform .1s}
.day-btn:hover{transform:translateY(-1px)}
.day-btn b{display:block;font-size:1.05rem;font-weight:800}
.day-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.meal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);align-items:start}
.meal:last-of-type{border-bottom:0}
.meal .when{display:flex;flex-direction:column;gap:6px}
.meal .title{font-weight:800;font-size:1.04rem;letter-spacing:-.01em}
.meal .portion{color:var(--muted);font-size:.9rem;margin-top:2px}
.meal .swap{font-size:.85rem;margin-top:8px;color:var(--muted);background:var(--surface-2);padding:8px 12px;border-radius:12px}
.meal .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.prep-pill{align-self:flex-start;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.prep-pill.fresh{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--warn)}
.recipe{grid-column:1/-1;background:var(--surface-2);border-radius:18px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}
.recipe ul,.recipe ol{margin:6px 0 0;padding-left:18px}
.recipe li{margin-bottom:4px}
.totals{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:16px 18px;margin-top:8px;border-radius:18px;background:var(--surface-2)}

/* Shop */
.groc{columns:2 280px;column-gap:28px}
.grp{break-inside:avoid;margin-bottom:22px}
.grp h3{margin-bottom:6px}
.gi{display:flex;gap:12px;align-items:center;padding:9px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.gi input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;margin:0;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.gi input:checked{background:var(--accent);border-color:var(--accent)}
.gi input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.gi.done .gname{text-decoration:line-through;color:var(--muted)}
.gi .gq{margin-left:auto;font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap;padding-left:8px}
.timeline{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.tl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px;padding:18px;border-radius:18px;background:var(--surface-2)}
.tl ul{margin:6px 0;padding-left:18px}

/* Progress */
.chart{width:100%;height:auto;display:block}
.sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sl label{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:700}
.sl input{width:100%;accent-color:var(--accent);height:28px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}

/* focus tips */
.focus{background:linear-gradient(135deg,var(--paprika-soft),var(--surface) 60%)}
.tips{margin:0;padding-left:0;list-style:none;counter-reset:t;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tips li{counter-increment:t;background:var(--surface);border-radius:16px;padding:14px 14px 14px 50px;position:relative;font-size:.93rem;box-shadow:var(--shadow)}
.tips li::before{content:counter(t);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--paprika);color:#fff;font-weight:800;font-size:.8rem}

.empty{text-align:center;padding:44px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{max-width:46ch;color:var(--muted)}
.empty .blob{width:72px;height:72px;border-radius:24px;background:var(--accent-soft);display:grid;place-items:center;font-size:2rem}
.spinner{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover}
@keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:none;opacity:1}}
.view.entering > *:not(.sheet):not(.scrim):not(.toast){animation:pop .25s ease-out both}

@media (max-width:900px){
  .coach{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;z-index:20;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) max(6px,calc(env(safe-area-inset-bottom,0px) - 14px)) max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid var(--line)}
  .brand,.rail-foot{display:none}
  .tabs{flex-direction:row;width:100%;justify-content:space-around}

@media (pointer:coarse){.chip{padding:9px 15px}.quick .chip{padding:8px 12px}.btn{min-height:44px}.x{padding:10px 12px}input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}}

/* Meals list (Today) */
.meals{display:flex;flex-direction:column;gap:6px}

.meal-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}

.meal-txt{display:flex;flex-direction:column;min-width:0}

.addbtn{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--accent-deep);transition:transform .08s}

.meal-items{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding:2px 0 6px 60px}

.mi .meta{font-size:.8rem;color:var(--muted)}

/* Add-food sheet: bottom sheet on phones, centred dialog on desktop */
body.sheet-open{overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(11,11,18,.45);z-index:40}
.scrim.enter{animation:fade .2s ease-out both}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:92vh;overflow-y:auto;z-index:41;background:var(--surface);border-radius:28px 28px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;box-shadow:0 -10px 40px rgba(11,11,18,.18)}
.sheet.enter{animation:up .28s cubic-bezier(.2,.8,.2,1) both}

@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}}
.grip{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head .meal-ic{width:40px;height:40px;border-radius:13px}
.sheet-head .close{margin-left:auto;font-size:1.6rem}
.snap{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:2px dashed var(--line);cursor:pointer;transition:border-color .15s,background .15s}
.snap:hover{border-color:var(--accent);background:var(--accent-soft)}
.snap > span:not(.snap-ic){display:flex;flex-direction:column;font-size:.9rem;min-width:0}
.snap b{font-size:1rem}
.snap img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.snap .x{margin-left:auto}
.snap-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--accent-deep);flex:none}
.snap-ic svg{width:26px;height:26px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
textarea.describe{min-height:96px;border-radius:18px;padding:14px 16px;font-size:1rem;line-height:1.45;resize:none}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.examples .chip{font-weight:600;font-size:.85rem}
.sheet-actions{display:flex;flex-direction:column;gap:6px}
.big-btn{width:100%;padding:16px;font-size:1rem;border-radius:16px}
.sheet-wait{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 0;text-align:center}
.pulse .meal-ic{width:64px;height:64px;border-radius:20px;animation:breathe 1.2s ease-in-out infinite}
.pulse .meal-ic svg{width:32px;height:32px}
@keyframes breathe{50%{transform:scale(1.08)}}
.review{display:flex;flex-direction:column;gap:8px}
.review-total{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:4px 2px 8px}
.review-total .big{font-size:2.4rem;font-weight:800;letter-spacing:-.04em}
.bubble{background:var(--surface-2);padding:14px 16px;border-radius:4px 18px 18px 18px;font-weight:700;font-size:1.05rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 10px;font-weight:800;cursor:pointer;box-shadow:inset 0 -2px 0 var(--line)}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:translateY(2px);box-shadow:none}

/* Toast */
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:.92rem;box-shadow:0 8px 24px rgba(11,11,18,.25);animation:pop .2s ease-out both;white-space:nowrap}

/* Week plan: compact */
.plan-notes{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 16px}

.meal-list{grid-column:1/-1;margin:0 0 6px 60px;border-radius:16px;background:var(--surface-2);padding:6px 4px 6px 14px}

.basket{display:flex;align-items:center;gap:12px}
.basket .basket-bar{flex:1}
.basket .num{font-size:.85rem}
.shoplist .grp{margin:0}
.shoplist .grp h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 2px}
.gi{min-height:46px}
.gi .gname{font-weight:600}
.basket-done{border-top:1px solid var(--line);padding-top:8px}
.basket-done summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 0;list-style:none}
.basket-done summary::-webkit-details-marker{display:none}
.basket-done summary::before{content:"▸ ";}
.basket-done[open] summary::before{content:"▾ ";}
.foot-note{font-size:.8rem;color:var(--muted);padding:0 6px}
.prep h2{font-size:1.05rem}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Progress: overview tiles, one-line weight entry */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);min-width:0;text-align:left;border:0;font:inherit;color:inherit}
.tile b{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.tile small{font-size:.9rem;font-weight:700;color:var(--muted)}
.tile .muted{font-size:.8rem}
.tile-btn{cursor:pointer;background:var(--accent-soft)}
.weigh-row{display:flex;gap:10px;align-items:stretch}
.unit-input{flex:1;display:flex;align-items:center;border-radius:14px;background:var(--surface-2);border:2px solid transparent;padding-right:14px}
.unit-input:focus-within{border-color:var(--accent);background:var(--surface)}
.unit-input input{background:transparent!important;border:0!important;box-shadow:none!important;font-size:1.3rem;font-weight:800}
.unit-input span{font-weight:700;color:var(--muted)}
.hist{margin-top:6px}
/* iOS date inputs ignore width and spill out of their box; make them behave */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
@media (max-width:820px){.tiles{grid-template-columns:1fr 1fr}}

/* Lean review: name as title, bookmark to save, quiet "+ Add item" */
.title-edit{display:flex;flex-direction:column;min-width:0;flex:1}
.title-edit .label{font-size:.75rem}
.title-edit input{border:0!important;background:transparent!important;box-shadow:none!important;padding:0;min-height:0;font-family:var(--display);font-size:1.2rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);border-bottom:2px dashed var(--line)!important;border-radius:0}
.title-edit input:focus{border-bottom-color:var(--accent)!important}
.bookmark{width:42px;height:42px;border-radius:13px;border:0;display:grid;place-items:center;cursor:pointer;background:var(--surface-2);color:var(--muted);flex:none}
.bookmark[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.bookmark svg{width:20px;height:20px}
.add-row{border:2px dashed var(--line);background:none;border-radius:14px;padding:12px;font-weight:700;color:var(--accent);cursor:pointer;text-align:left;font:inherit;font-weight:700}
.add-row span{font-size:1.1rem;margin-right:4px}
.sheet-head .close{margin-left:0}
.sheet-head h2{flex:1;min-width:0}
.store-btn span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.store-btn small{font-size:.68rem;font-weight:600;color:var(--muted)}

/* Today: tappable days-logged circles */
.week-nav{display:flex;align-items:center;gap:2px}
.week-dots button{width:26px;height:26px;border-radius:50%;border:0;display:grid;place-items:center;font-size:.68rem;font-weight:800;background:var(--surface-2);color:var(--muted);cursor:pointer;padding:0}
.week-dots button.on{background:var(--accent);color:var(--accent-ink)}
.week-dots button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.week-dots button:disabled{opacity:.4;cursor:default}
.wk-arrow{width:24px;height:30px;border:0;background:none;color:var(--muted);font-size:1.3rem;font-weight:700;cursor:pointer;line-height:1;padding:0}
.wk-arrow:disabled{opacity:.25;cursor:default}
.sheet-date{display:block;font-size:.78rem;font-weight:600;color:var(--muted);font-family:var(--body);letter-spacing:0}
.streak .label{white-space:nowrap}
@media (max-width:420px){.streak{gap:8px;padding:10px 10px 10px 14px}.week-dots{gap:4px}.week-dots button{width:25px;height:25px}.wk-arrow{width:18px}}

/* Onboarding: full screen, one short step at a time */
body.onboarding .rail{display:none}
body.onboarding .app{grid-template-columns:minmax(0,1fr)}
body.onboarding main{padding-bottom:24px}
.onboard{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ob-top{display:flex;align-items:center;gap:10px}
.ob-progress{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ob-progress span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ob-head{display:flex;flex-direction:column;gap:6px}
.ob-head h1{font-size:clamp(1.7rem,6vw,2.2rem)}
.ob-head .ai-avatar{margin-bottom:6px}
.ob-body{display:flex;flex-direction:column;gap:18px}
.ob-q{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ob-q legend{font-weight:700;font-size:.92rem;margin-bottom:8px;padding:0}
.ob-chips{display:flex;flex-wrap:wrap;gap:8px}
.ob-chips .chip{padding:10px 14px;font-size:.92rem}
.ob-chips .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.unit-input.sm input{font-size:1.05rem;padding:10px 8px 10px 12px}
.unit-input.sm span{font-size:.85rem}
.ob-actions{display:flex;flex-direction:column;gap:6px;position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.ob-targets .tiles{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:6px}
.ob-targets .tile{box-shadow:none;background:var(--surface-2);padding:12px}
.ob-targets .tile b{font-size:1.3rem}
@media (max-width:420px){.ob-targets .tiles{grid-template-columns:1fr 1fr}}
.ob-notes{line-height:1.55}.ob-notes ul{margin:6px 0;padding-left:20px}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><i></i>forkcast</div>
    <div class="tabs" id="tabs"></div>
    <div class="rail-foot" id="railFoot"></div>
  </nav>
  <main><div class="view" id="view"></div></main>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === core/constants.js ===
// Icons, tabs, meal slots and consultation sections
const ICONS = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/><path d="M12 8v4l2.5 2"/></svg>',
  coach:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 2.5c.4 0 .7.3.8.7l.9 3.4a5 5 0 0 0 3.6 3.6l3.4.9a.8.8 0 0 1 0 1.6l-3.4.9a5 5 0 0 0-3.6 3.6l-.9 3.4a.8.8 0 0 1-1.6 0l-.9-3.4a5 5 0 0 0-3.6-3.6l-3.4-.9a.8.8 0 0 1 0-1.6l3.4-.9a5 5 0 0 0 3.6-3.6l.9-3.4c.1-.4.4-.7.8-.7z"/><path d="M18.5 1.5c.2 0 .4.1.4.3l.3 1.1c.2.6.6 1 1.2 1.2l1.1.3a.4.4 0 0 1 0 .8l-1.1.3c-.6.2-1 .6-1.2 1.2l-.3 1.1a.4.4 0 0 1-.8 0l-.3-1.1c-.2-.6-.6-1-1.2-1.2l-1.1-.3a.4.4 0 0 1 0-.8l1.1-.3c.6-.2 1-.6 1.2-1.2l.3-1.1c0-.2.2-.3.4-.3z" opacity=".55"/></svg>',
  plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.3 11.2a1 1 0 0 1-1 .8H7.3a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 7-7"/><path d="M15 7h4v4"/></svg>'
};
const TABS = [['today','Today'],['coach','Dietitian'],['plan','Week plan'],['shop','Shop & prep'],['progress','Progress']];
const SLOTS = ['Breakfast','Lunch','Snack','Dinner'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SECTIONS = [
  ['basics','Body & goal'],['health','Health screening'],['lifestyle','Lifestyle'],
  ['current_diet','Current eating'],['obstacles','Weak points'],['preferences','Food preferences'],['cooking','Cooking & prep'],['shopping','Shopping & budget']
];

// Your dietitian's name and style, chosen in onboarding or About you.
const COACH_NAMES = ['Mila','Theo','Nora','Leo','Ava','Sam'];
const COACH_TONES = [
  ['warm','Warm & encouraging','warm, kind and encouraging'],
  ['direct','Straight to the point','brief, direct and practical; no small talk'],
  ['fun','Friendly & fun','friendly and upbeat with a little light humour, still precise']
];
const coachName = () => String(S.profile.data.coach?.name || 'Mila').trim().slice(0, 20) || 'Mila';
const coachTone = () => COACH_TONES.find(t => t[0] === S.profile.data.coach?.tone) || COACH_TONES[0];
const coachPersona = () => `Your name is ${coachName()}. Your style: ${coachTone()[2]}. Never sign your messages.`;

// === core/prompts.js ===
// Everything Forkcast says to the AI lives here: the dietitian rules and the
// prompts for food logging, week plans, shopping lists and recipes.
const COACH_RULES = `You are the dietitian inside "Forkcast", a meal-prep and nutrition app. Act as an experienced, evidence-based dietitian and nutrition coach with 10-15+ years of practice: clinical nutrition, Mediterranean-style principles, sports nutrition, weight-management science, behavioural habit change and meal-prep practicality. Never claim to be or imitate any real person.

HOW YOU WORK
- Never give a generic diet before understanding the person. Run the first consultation conversationally, 1-3 questions per message, roughly in this order: basics (age, sex, height, weight, goal weight, main goal, daily activity) -> health screening (pregnancy/breastfeeding, diabetes, kidney, liver, heart, GI, thyroid, allergies, intolerances, medications affecting appetite/blood sugar/weight, eating-disorder history or concerns, recent unexplained weight loss) -> lifestyle (job, steps, training type/frequency, sleep, stress, schedule, meal times, travel) -> current eating (ask "What did a normal day of eating look like for you recently?", drinks, coffee, alcohol, takeout, weekends) -> weak points (ALWAYS ask what they see as their weak point or why they think they aren't losing weight / reaching their goal, e.g. weekends, evening snacking, eating out, stress, alcohol; then dig in: when it happens, triggers, what a typical occasion looks like) -> food preferences (ask SEPARATELY what they genuinely enjoy and what they never want; dietary pattern; cuisines) -> cooking & meal prep (skill, appliances, max weekday minutes, leftovers OK, repeats OK, people cooked for; offer A cook fresh / B prep twice a week / C prep once a week / D very low cooking) -> shopping (country, city, supermarket, weekly budget, priority: cheapest/convenience/organic/premium/balance).
- WEAK POINT FOCUS: once you know the person's weak point, make it a focus area. Give 3-5 specific, practical tips and tricks for that exact situation (e.g. weekends: plan one meal out, prep a Sunday brunch, protein-forward weekend breakfasts, alcohol swaps) and return them in "focus". Weave it into advice, plans and check-ins; ask at each check-in how the weak point went and update the focus if a new one appears.
- Don't re-ask what the profile already holds unless it may have changed. After onboarding, behave like a follow-up appointment.
- ALWAYS end your reply with exactly one clear question that moves things forward.
- When the basics are known, explain the estimated targets briefly: Mifflin-St Jeor BMR -> activity TDEE -> goal. Moderate deficit for fat loss (about 10-20%, max ~500 kcal), modest surplus (~200-300 kcal) for muscle gain, ~TDEE for maintenance. Protein from body weight, activity, age and goal (healthy adults ~1.2-2.2 g/kg). Fiber ~14 g per 1000 kcal. Call these estimates, not measurements.
- Keep meals the person already eats where possible; small improvements beat overhauls. 80/20 flexibility: dessert, pizza, restaurants and social events can fit. Never call foods good, bad, clean or cheat. Never criticise what someone ate; give neutral, practical feedback (e.g. "you have ~450 kcal left, room for dinner and a small dessert").
- SAFETY: never encourage starvation, purging, extreme fasting, crash diets, unsafe supplements or very-low-calorie diets. No calorie-deficit plan for anyone under 18 without professional supervision. For pregnancy, diabetes, kidney or liver disease, eating-disorder concerns, rapid unexplained weight change or similar: say you can help organise general nutrition but changes should be coordinated with their healthcare professional, and set medical_flag. No high-protein targets with kidney disease. When uncertain, label KNOWN / ESTIMATED / NEEDS MEDICAL REVIEW.
- Weekly check-ins: look at trends (several weigh-ins), not single numbers. If adherence was low, improve the plan (swap disliked meals, more volume, easier meals, more protein) before cutting calories. Avoid frequent or aggressive calorie cuts.
- If the person tells you what they ate, add it to log_items with honest estimates and update them on what's left today.
- Tone: calm, warm, practical, precise, encouraging without being patronising. Short paragraphs, plain words. Reply in the language the person writes in.`;

// Short brief for everyday chat after onboarding (faster: less to read each time).
const COACH_FOLLOWUP = `You are the dietitian inside "Forkcast": evidence-based, warm, practical, concise. The person's full profile, targets and today's food are in APP STATE; don't re-ask what's there.
- Answer in max ~90 words, plain words, in the person's language; end with one short question.
- Keep foods they enjoy; 80/20 flexibility; never call foods good/bad/clean/cheat; never criticise what they ate.
- Use their weak-point focus when relevant. For check-ins, look at trends; if adherence was low, adjust the plan before cutting calories.
- If they say what they ate, put it in log_items with honest estimates.
- SAFETY: no starvation, crash diets or very-low-calorie advice; medical issues -> suggest their doctor and set medical_flag.`;

// Streamed chat: the reply comes first as plain text (shown while it's written),
// then the app data after a marker line.
const COACH_STREAM_FORMAT = `First write your reply to the person: plain text, max ~90 words, **bold** and "- " bullets allowed, ending with one short question.
Then, on a new line, write exactly @@DATA@@ followed by ONE JSON object (no other text after it):
{"quick_replies": up to 4 short tap-able answers to your question,
 "profile_patch": only new or changed facts, using sections basics{age,sex,height_cm,weight_kg,goal_weight_kg,waist_cm,goal,activity}, health{conditions,allergies,medications,notes}, lifestyle{job,training,sleep,stress,schedule}, current_diet{typical_day,alcohol,takeout,weekends}, obstacles{weak_point,triggers}, preferences{likes,dislikes,pattern,cuisines}, cooking{level,appliances,max_weekday_minutes,people,prep_style}, shopping{country,city,supermarkets,budget,priority}; {} if nothing new,
 "targets": null or {"kcal":n,"protein":n,"carbs":n,"fat":n,"fiber":n} only when you deliberately change targets,
 "log_items": [] or [{"name":s,"amount":s,"kcal":n,"protein":n,"carbs":n,"fat":n,"fiber":n,"slot":"Breakfast"|"Lunch"|"Snack"|"Dinner"}],
 "focus": null or {"weak_point":s,"why":s,"tips":[3-4 short tips]},
 "medical_flag": null or one line}`;

const COACH_FORMAT = `Reply with ONLY one JSON object, no other text:
{"reply": string (max ~140 words; **bold** and "- " bullet lines allowed; must end with one question),
 "quick_replies": array of up to 4 short tap-able answers to your question (strings, may be empty),
 "profile_patch": object holding ONLY new or changed facts, using these sections and keys:
   basics{age:number, sex:"female"|"male", height_cm:number, weight_kg:number, goal_weight_kg:number, waist_cm:number, goal:"fat loss"|"muscle gain"|"recomposition"|"maintenance"|"performance"|"healthier eating"|"digestive comfort"|"other", activity:"sedentary"|"light"|"moderate"|"very"|"extra"},
   health{conditions, allergies, intolerances, medications, notes}, lifestyle{job, steps, training, sleep, stress, schedule, meal_times},
   current_diet{typical_day, drinks, alcohol, takeout, weekends}, obstacles{weak_point, when, triggers}, preferences{likes, dislikes, pattern, cuisines},
   cooking{level, appliances, max_weekday_minutes, leftovers_ok, repeats_ok, people, prep_style}, shopping{country, city, supermarkets, budget, priority}.
   Use short strings or numbers. Write "none" when the person says there is nothing (e.g. no allergies). {} if nothing new.
 "targets": null, or {"kcal":n,"protein":n,"carbs":n,"fat":n,"fiber":n} only when you deliberately set or adjust targets,
 "log_items": [] or [{"name":s,"amount":s,"kcal":n,"protein":n,"carbs":n,"fat":n,"fiber":n,"slot":"Breakfast"|"Lunch"|"Snack"|"Dinner"}],
 "focus": null, or {"weak_point": short name e.g. "Weekends", "why": one sentence on what happens, "tips": 3-5 short concrete tips} whenever you identify or update their weak point,
 "onboarding_complete": true once all eight consultation areas are covered, else false,
 "medical_flag": null or a one-line note when something NEEDS MEDICAL REVIEW}`;

const greeting = () => `Hi, I'm ${coachName()}, your dietitian here in Forkcast. Before I suggest a single meal I want to understand you: your body and goal, your health, your routine, what you love eating and how much you actually want to cook. Think of it as a first appointment, a few questions at a time.

Let's start simple: **how old are you, and what's your height and current weight?**`;

const PLAN_RULES = `You are an experienced evidence-based dietitian writing a realistic 7-day meal-prep plan.
Rules: build around foods the person enjoys and already eats; never include their dislikes or allergens; respect their dietary pattern, cooking time, prep style and budget; use ingredients sold in their country's normal supermarkets; overlap ingredients across days (batch-cooked proteins, grains, roasted veg, one or two sauces) to limit waste; leftovers and repeats only if they accept them; include 80/20 flexibility (a dessert, a pizza or restaurant night can fit). Keep each day within ~5% of the kcal target and hit protein. Never call foods good/bad/clean/cheat.`;

// Prompt builders. Each takes plain data and returns the input sent to the AI,
// so changing what the AI does never means touching the UI code.
const PROMPTS = {
  // One review after the onboarding form: the person's answers in, the
  // dietitian's welcome note, weak-point plan and safety notes out.
  onboardingReview(profile, targets){
    return `You are the dietitian inside "Forkcast". ${coachPersona()} A new person just completed the intake form below. Review it like the end of a first consultation.
${COACH_RULES.split('HOW YOU WORK')[0].trim()}
SAFETY: never encourage starvation, crash diets or very-low-calorie diets; no calorie deficit for anyone under 18; for pregnancy, diabetes, kidney/liver disease, eating disorders or unexplained weight loss, say changes should be agreed with their doctor and set medical_flag; no high-protein targets with kidney disease.

INTAKE (JSON): ${JSON.stringify(profile)}
TARGETS ALREADY CALCULATED ON THE DEVICE (Mifflin-St Jeor, estimates): ${JSON.stringify(targets)}

Reply with ONLY one JSON object:
{"summary": "warm welcome in the person's language, max 110 words: what you understood (goal, routine, weak point), one line on why the targets fit, the 1-2 most useful first steps, and end with ONE question. **bold** and '- ' bullets allowed",
 "quick_replies": up to 3 short answers to your question,
 "focus": {"weak_point": short name, "why": one sentence, "tips": 3-4 short concrete tips for exactly their situation},
 "targets": null, or {"kcal":n,"protein":n,"carbs":n,"fat":n,"fiber":n} ONLY if the calculated targets are unsafe or clearly wrong for this person (e.g. health condition, minor),
 "medical_flag": null or one line when something needs medical review}`;
  },

  // Dietitian chat: standing instructions + app snapshot, then the conversation.
  // Once onboarding is done the brief is much shorter: no consultation script.
  coach(state, history, onboarded, persona){
    const rules = (persona ? persona + '\n' : '') + (onboarded ? COACH_FOLLOWUP : COACH_RULES);
    return [{ role:'user', content: rules + '\n\n' + COACH_STREAM_FORMAT + '\n\nAPP STATE (JSON, what you already know):\n' + JSON.stringify(state) + '\n\nThe conversation follows.' }, ...history];
  },

  // Food diary estimate from text and/or a photo.
  food({ text, slot, country, targets, eaten, hasPhoto, clarification }){
    return `You are an evidence-based dietitian estimating the nutrition of a meal someone logged in a food diary.
Person's daily targets: ${targets ? JSON.stringify(targets) : 'not set yet'}.
Already eaten today before this meal: ${JSON.stringify(eaten)}.
Meal slot: ${slot}. Country/region if known: ${country || 'unknown'}.
What they wrote: """${text || '(no text — see photo)'}"""${hasPhoto ? '\nA photo of the food is attached; use it to judge items and portions.' : ''}${clarification ? `\nTheir answer to your portion question: """${clarification}""". Do not ask another question.` : ''}

Split it into separate foods with realistic portion estimates (use typical portions when unstated). Numbers are grams for macros.
Ask a clarifying question ONLY if one portion is genuinely ambiguous and would change the total by more than ~150 kcal; otherwise clarify must be null.
Reply with only JSON:
{"items":[{"name":"Scrambled eggs","amount":"2 large","kcal":180,"protein":13,"carbs":2,"fat":13,"fiber":0}],
 "clarify": null or "Approximately how much rice did you eat: 100 g, 200 g, or something else?",
 "options": ["100 g","200 g","300 g"],
 "meal_name": "short, appetising name for this combination so it can be reused, 2-4 words, e.g. Protein oat bowl"}`;
  },

  // Shared context for the plan and shopping prompts.
  planContext({ profile, targets, focus, checkin }){
    return `PERSON (from consultation): ${JSON.stringify(profile)}
DAILY TARGETS (estimates): ${targets ? JSON.stringify(targets) : 'unknown — aim for a balanced ~2000 kcal day'}
WEAK POINT FOCUS (design the week to help with this): ${JSON.stringify(focus || 'not known yet')}
LATEST CHECK-IN: ${JSON.stringify(checkin || 'none')}`;
  },

  plan(ctx){
    return `${PLAN_RULES}

${PROMPTS.planContext(ctx)}

Reply with only JSON:
{"days":[{"day":"Mon","meals":[{"slot":"Breakfast","name":"Greek yogurt bowl with berries and oats","portion":"200 g 2% yogurt, 40 g oats, 100 g berries","kcal":390,"p":28,"c":48,"f":9,"prep":"batch" or "fresh","swap":"one short swap, e.g. 150 g chicken → 160 g turkey → 180 g white fish → 200 g tofu","photo":"2-4 word English search term for a photo of the finished dish, e.g. yogurt bowl berries"}]}],
 "notes":"ONE short sentence (max 20 words) on how this week's prep works"}
Exactly 7 days Mon..Sun; slots from Breakfast, Lunch, Snack, Dinner (snack optional). Keep names and portions concise.`;
  },

  shopping(ctx, days, store){
    return `${PLAN_RULES}

${PROMPTS.planContext(ctx)}

THE WEEK'S PLAN:
${days.map(d => d.day + ': ' + d.meals.map(m => `${m.slot} – ${m.name} (${m.portion})`).join('; ')).join('\n')}

SUPERMARKET: ${store || 'their usual supermarket'}. Use product names, own brands and package sizes typical of this supermarket where you know them, and estimate prices in local currency (never claim they are verified).
Write ONE consolidated grocery list for this week with approximate quantities to buy (round up to real package sizes, metric unless the person's country uses imperial), and a meal-prep schedule matching their prep style.
Reply with only JSON:
{"grocery":[{"group":"Protein","items":[{"name":"Chicken breast","qty":"1.2 kg (2 packs)","note":"optional short note, e.g. own-brand product name"}]}],
 "prep":[{"when":"Sunday","minutes":"60–90 min","tasks":["Roast 1 kg chicken thighs","Cook 400 g dry rice"],"fridge":"what keeps 3–4 days in the fridge","freeze":"what to freeze","fresh":"what to make fresh on the day"}],
 "budget_note":"one sentence: rough total cost at this supermarket in local currency, clearly an estimate (prices not verified)"}
Groups in this order, skipping empty ones: Protein, Vegetables, Fruit, Carbohydrates & grains, Dairy / alternatives, Pantry, Snacks, Sauces / condiments, Frozen, Optional.`;
  },

  recipe(meal, person){

// === core/helpers.js ===
// Small pure helpers: DOM, escaping, dates, merging, light markdown
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0 = n => Math.round(Number(n) || 0);
const dkey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const daysBetween = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 864e5);
const mondayOf = (d = new Date()) => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return dkey(x); };
const slotNow = () => { const h = new Date().getHours() + new Date().getMinutes()/60; return h < 10.5 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 17.5 ? 'Snack' : 'Dinner'; };
const vday = () => S.day || dkey(); // the day shown on Today
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function merge(a, b){ const o = {...(a||{})}; for (const k in (b||{})) { const v = b[k]; if (v === null || v === undefined || v === '') continue; o[k] = isObj(v) && isObj(o[k]) ? merge(o[k], v) : v; } return o; }
function md(s){
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split('\n');
  let out = '', inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*[-•]\s+(.*)/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    out += l.trim() ? l + '<br>' : '<br>';
  }
  if (inList) out += '</ul>';
  return out.replace(/(<br>)+$/,'').replace(/(<br>){3,}/g,'<br><br>');
}
const sumItems = items => items.reduce((t, i) => ({kcal:t.kcal+r0(i.kcal), protein:t.protein+r0(i.protein), carbs:t.carbs+r0(i.carbs), fat:t.fat+r0(i.fat), fiber:t.fiber+r0(i.fiber)}), {kcal:0,protein:0,carbs:0,fat:0,fiber:0});
const pfc = i => `<span class="pfc"><span class="p">P ${r0(i.protein ?? i.p)}</span> · <span class="c">C ${r0(i.carbs ?? i.c)}</span> · <span class="f">F ${r0(i.fat ?? i.f)}</span></span>`;

// === core/storage.js ===
// Storage: one row per document in Supabase (table user_docs), plus a
// per-account browser copy so the app opens instantly and works offline.
const LS = 'forkcast:v1:';
const Store = {
  sb: null, uid: null, pending: {}, writing: {},
  key(k){ return LS + (this.uid || 'anon') + ':' + k; },
  local(k){ try { return JSON.parse(localStorage.getItem(this.key(k))); } catch { return null; } },
  async remote(k){
    if (!this.sb || !this.uid) return null;
    const { data, error } = await this.sb.from('user_docs').select('data').eq('key', k).maybeSingle();
    if (error) { console.warn('load failed', k, error.message); return null; }
    return data ? data.data : null;
  },
  save(k, v){
    try { localStorage.setItem(this.key(k), JSON.stringify(v)); } catch {}
    if (!this.sb || !this.uid) return;
    this.pending[k] = v; this.flush(k);
  },
  async flush(k){
    if (this.writing[k]) return;
    this.writing[k] = true;
    while (this.pending[k]) {
      const v = this.pending[k]; this.pending[k] = null;
      const { error } = await this.sb.from('user_docs').upsert({ user_id:this.uid, key:k, data:JSON.parse(JSON.stringify(v)), updated_at:new Date().toISOString() });
      if (error) { console.warn('save failed', k, error.message); S.saveError = true; render(); }
      else if (S.saveError) { S.saveError = false; render(); }
    }
    this.writing[k] = false;
  },
  async remove(k){
    try { localStorage.removeItem(this.key(k)); } catch {}
    if (this.sb && this.uid) await this.sb.from('user_docs').delete().eq('key', k);
  }
};

// === core/nutrition.js ===
// Nutrition maths: Mifflin-St Jeor targets, consultation progress, streaks
const ACT = { sedentary:1.2, light:1.375, moderate:1.55, very:1.725, extra:1.9 };
function calcTargets(d){
  const b = d.basics || {};
  const age = +b.age, h = +b.height_cm, w = +b.weight_kg;
  if (!age || !h || !w || !b.sex) return null;
  const bmr = 10*w + 6.25*h - 5*age + (String(b.sex).startsWith('m') ? 5 : -161);
  const tdee = bmr * (ACT[b.activity] || 1.375);
  const goal = String(b.goal || 'maintenance');
  let kcal = tdee;
  if (goal.includes('loss') && age >= 18) kcal = Math.max(tdee - 500, tdee * 0.82, bmr);
  else if (goal.includes('gain')) kcal = tdee + 250;
  else if (goal.includes('recomp')) kcal = tdee - 200;
  const kidney = /kidney|renal|ckd/i.test(JSON.stringify(d.health || {}));
  const perKg = kidney ? 0.8 : goal.includes('loss') || goal.includes('gain') ? 1.8 : goal.includes('recomp') ? 2.0 : goal.includes('perform') ? 1.6 : 1.3;
  const refW = b.goal_weight_kg && goal.includes('loss') && w/((h/100)**2) > 30 ? +b.goal_weight_kg : w;
  kcal = Math.round(kcal / 10) * 10;
  const protein = Math.round(perKg * refW);
  const fat = Math.round(kcal * 0.3 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9) / 4));
  return { kcal, protein, carbs, fat, fiber: Math.round(kcal/1000*14), bmr: Math.round(bmr), tdee: Math.round(tdee), kidney };
}
const targets = () => S.profile.targets || calcTargets(S.profile.data);
function sectionDone(key){
  const v = S.profile.data[key];
  if (key === 'basics') return !!(v && v.age && v.height_cm && v.weight_kg && v.sex && v.goal);
  return !!(v && Object.values(v).some(x => x !== '' && x != null));
}

function streak(){
  const days = new Set(S.profile.loggedDays || []); let n = 0; const d = new Date();
  if (!days.has(dkey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dkey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// Shrink a photo to ~1024 px JPEG so uploads stay small and fast.
function photoToBase64(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ mime:'image/jpeg', data:c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ code:'image_rejected', message:'That photo couldn\'t be read. Try a JPEG or PNG.' }); };
    img.src = url;
  });
}

const AI = {
  async json(input, opts = {}){
    if (!navigator.onLine) throw { code:'offline' };
    const token = await Auth.token();
    if (!token) throw { code:'unauthorized' };
    const images = opts.images ? await Promise.all([...opts.images].map(photoToBase64)) : [];
    let res;
    try {
      const c = window.FORKCAST_CONFIG || {};
      res = await fetch(c.aiUrl || c.supabaseUrl + '/functions/v1/ai', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token, apikey:c.supabaseAnonKey },
        body: JSON.stringify({ input, images, tier: opts.modelTier === 'quick' ? 'quick' : 'default', json:true }) });
    } catch { throw { code:'offline' }; }
    const body = await res.json().catch(() => ({}));
    // Errors may arrive with status 200, because the server starts streaming before Gemini answers.
    if (!res.ok || body.code) throw { code: body.code || 'upstream_error', message: body.message };
    console.info(`AI answered with ${body.model} in ${body.ms} ms`);
    return body.json;
  },
  // Streamed answer: onText(fullTextSoFar) is called as words arrive.
  async stream(input, opts = {}){
    if (!navigator.onLine) throw { code:'offline' };
    const token = await Auth.token();
    if (!token) throw { code:'unauthorized' };
    const c = window.FORKCAST_CONFIG || {};
    let res;
    try {
      res = await fetch(c.aiUrl || c.supabaseUrl + '/functions/v1/ai', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token, apikey:c.supabaseAnonKey },
        body: JSON.stringify({ input, tier: opts.modelTier === 'quick' ? 'quick' : 'default', stream:true }) });
    } catch { throw { code:'offline' }; }
    if (!res.ok) { const b = await res.json().catch(() => ({})); throw { code: b.code || 'upstream_error', message: b.message }; }
    const reader = res.body.getReader(), dec = new TextDecoder(); let text = '';
    for (;;) { const { done, value } = await reader.read(); if (done) break; text += dec.decode(value, { stream:true }); opts.onText?.(text); }
    if (!text.trim()) throw { code:'empty_completion' };
    return text;
  }
};

// Sign-in with Supabase (email + password). Keeps the session on the device,
// so you stay signed in until you sign out.
const Auth = {
  sb: null,
  init(){
    const c = window.FORKCAST_CONFIG || {};

    this.sb = supabase.createClient(c.supabaseUrl, c.supabaseAnonKey, { auth:{ persistSession:true, autoRefreshToken:true } });
    Store.sb = this.sb;
    this.sb.auth.onAuthStateChange((event, session) => {
      if (session?.user && Store.uid !== session.user.id) setTimeout(() => this.enter(session.user), 0);
      if (event === 'SIGNED_OUT') this.leave();
    });
    return true;
  },
  async start(){
    const { data } = await this.sb.auth.getSession();
    if (data.session?.user) this.enter(data.session.user);
    else { S.auth = { status:'signed-out', mode:'signin' }; render(); }
  },
  async token(){ const { data } = await this.sb.auth.getSession(); return data.session?.access_token || null; },
  enter(user){

  },
  leave(){ Store.uid = null; resetState(); S.auth = { status:'signed-out', mode:'signin' }; render(); },
  async submit(mode, email, password){
    S.auth.busy = true; S.auth.error = null; S.auth.info = null; render();
    const redirect = location.origin + location.pathname;
    const { data, error } = mode === 'signup'
      ? await this.sb.auth.signUp({ email, password, options:{ emailRedirectTo:redirect } })
      : await this.sb.auth.signInWithPassword({ email, password });
    S.auth.busy = false;
    if (error) S.auth.error = error.message;
    else if (mode === 'signup' && !data.session) { S.auth.info = 'Check your email and tap the confirmation link, then sign in here.'; S.auth.mode = 'signin'; }
    render();
  },
  async reset(email){
    if (!email) { S.auth.error = 'Type your email first, then tap “Forgot password”.'; render(); return; }
    const { error } = await this.sb.auth.resetPasswordForEmail(email, { redirectTo:location.origin + location.pathname });
    S.auth.error = error ? error.message : null; S.auth.info = error ? null : 'We sent you an email with a link to set a new password.'; render();
  },
  async signOut(){ await this.sb.auth.signOut(); }
};

// === services/coach.js ===
// Dietitian chat: sends the conversation, applies profile, targets, focus and log updates
async function sendChat(text){
  text = text.trim();
  if (!text || S.busy.chat) return;
  if (!S.sampleOK) { S.err.chat = 'Sign in to talk to your dietitian.'; render(); return; }
  if (!S.chat.turns.length) S.chat.turns.push({ role:'assistant', content:greeting(), at:Date.now() });
  S.chat.turns.push({ role:'user', content:text, at:Date.now() });
  S.chat.history = false; S.draft.chat = ''; S.draft.ask = ''; S.err.chat = null; S.busy.chat = true;
  save.chat(); render(); scrollChat();
  const history = S.chat.turns.slice(S.chat.start || 0).slice(-20).map(t => ({ role:t.role, content:t.content }));
  const input = PROMPTS.coach(appState(), history, S.profile.onboarded, coachPersona());
  try {
    // Everyday chat uses the fast model; the reply streams in word by word.
    S.chat.live = '';
    const full = await S.sample.stream(input, { modelTier: S.profile.onboarded ? 'quick' : 'default', onText: t => showLive(t) });
    const [replyPart, dataPart = ''] = full.split('@@DATA@@');
    const reply = replyPart.trim() || 'Could you tell me a bit more?';
    const r = looseJson(dataPart) || {};
    if (isObj(r.profile_patch)) S.profile.data = merge(S.profile.data, r.profile_patch);
    if (isObj(r.targets) && r.targets.kcal) { S.profile.targets = { kcal:r0(r.targets.kcal), protein:r0(r.targets.protein), carbs:r0(r.targets.carbs), fat:r0(r.targets.fat), fiber:r0(r.targets.fiber) }; S.profile.targetsSource = 'coach'; }
    if (isObj(r.focus) && r.focus.weak_point) S.profile.focus = { weak_point:String(r.focus.weak_point), why:String(r.focus.why || ''), tips:(Array.isArray(r.focus.tips) ? r.focus.tips : []).slice(0,5).map(String), at:dkey() };
    if (r.medical_flag) S.profile.flags = [...new Set([...(S.profile.flags || []), String(r.medical_flag)])].slice(-5);
    S.profile.quick = Array.isArray(r.quick_replies) ? r.quick_replies.slice(0,4).map(String) : [];
    let logged = 0;
    if (Array.isArray(r.log_items) && r.log_items.length) { addItems(r.log_items.map(i => ({...i, slot: SLOTS.includes(i.slot) ? i.slot : slotNow()})), dkey()); logged = r.log_items.length; }
    S.chat.turns.push({ role:'assistant', content:reply, quick:S.profile.quick, flag:r.medical_flag || null, logged, at:Date.now() });
    save.profile(); save.chat();
  } catch (e) {
    hardFail(e); S.err.chat = errText(e);
  }
  S.chat.live = null;
  S.busy.chat = false; render(); scrollChat();
}
function scrollChat(){ const m = $('.msgs'); if (m) m.scrollTop = m.scrollHeight; }

// A fresh conversation each day (or after 6 quiet hours): a short greeting that
// fits the moment, with suggestions. Earlier messages stay available on request.
// The greeting is written on the device, so it costs no AI call.
function maybeNewSession(force){
  const turns = S.chat.turns, last = turns[turns.length - 1];
  if (!force && (!turns.length || !S.profile.onboarded)) return;
  const lastAt = last?.at || 0, stale = !lastAt || dkey(new Date(lastAt)) !== dkey() || Date.now() - lastAt > 6 * 36e5;
  if (!force && !stale) return;
  if (last?.fresh) turns.pop(); // an untouched old greeting: refresh it instead of stacking
  const h = new Date().getHours(), hi = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const t = targets(), eaten = sumItems(S.logs[dkey()]?.items || []);
  const checkDue = (() => { const l = S.progress.checkins.slice(-1)[0]?.date || S.profile.onboardedAt; return l && daysBetween(l, dkey()) >= 7; })();
  const line = !S.profile.onboarded ? 'Shall we pick up your consultation where we left off?'
    : checkDue ? 'It\'s been a week, so a quick check-in would help me fine-tune your plan.'
    : eaten.kcal && t ? `So far today: ${eaten.kcal} of ${t.kcal} kcal and ${eaten.protein} g protein. How can I help?`
    : 'What would you like to work on today?';
  const quick = !S.profile.onboarded ? ['Let\'s continue'] : [
    ...(checkDue ? ['Weekly check-in'] : []),
    h < 11 ? 'Ideas for breakfast' : h < 16 ? 'Ideas for lunch' : 'What should I have for dinner?',
    'How am I doing this week?', 'I have a question'
  ].slice(0, 4);
  S.chat.start = turns.length;
  turns.push({ role:'assistant', content:`${hi}! ${line}`, quick, at:Date.now(), fresh:true });
  S.chat.history = false;
  save.chat();
}

// Paint the reply as it streams, without redrawing the whole screen.
function showLive(full){
  const visible = full.split('@@DATA@@')[0].replace(/@+[DAT]*@*$/, '').trim();
  if (!visible) return;
  if (S.chat.live === '' || !document.getElementById('liveMsg')) { S.chat.live = visible; render(); }
  S.chat.live = visible;
  const el = document.getElementById('liveMsg'); if (el) el.innerHTML = md(visible);
  scrollChat();
}
// Tolerant JSON read for the data block after the reply.
function looseJson(t){
  t = String(t || ''); const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(t.slice(a, b + 1)); } catch { return null; }
}

async function analyseFood(text, clarification){

  if (!text.trim() && !S.logPhoto) return;
  S.busy.log = true; S.err.log = null; render();
  const t = targets(), eaten = sumItems(S.logs[vday()]?.items || []);
  const prompt = PROMPTS.food({ text, slot:S.logSlot, country:S.profile.data.shopping?.country, eaten,
    targets: t && { kcal:t.kcal, protein:t.protein, carbs:t.carbs, fat:t.fat, fiber:t.fiber },
    hasPhoto: !!S.logPhoto, clarification });
  try {
    const opts = { modelTier:'quick' }; // fast model, minimal thinking: a meal estimate doesn't need more
    if (S.logPhoto && S.canImages) opts.images = [S.logPhoto];
    const r = await S.sample.json(prompt, opts);
    const items = Array.isArray(r?.items) ? r.items : [];
    if (r?.clarify && !clarification) {
      S.logResult = { text, clarify:String(r.clarify), options:(r.options || []).slice(0,4).map(String), items };
    } else {
      S.logResult = { review: items.map(cleanItem), feedback: r?.feedback ? String(r.feedback) : null, name: String(r?.meal_name || '').slice(0, 40), save: true };
    }
  } catch (e) { hardFail(e); S.err.log = errText(e); }
  S.busy.log = false; render();
}

const cleanItem = i => ({ name:String(i.name || 'Food'), amount:String(i.amount || ''), kcal:r0(i.kcal), protein:r0(i.protein ?? i.p), carbs:r0(i.carbs ?? i.c), fat:r0(i.fat ?? i.f), fiber:r0(i.fiber) });

// Save the reviewed (and possibly edited) items to the open meal, remember the
// combination under "My meals", and close the sheet.
function confirmLog(){
  const r = S.logResult, items = (r?.review || []).filter(i => i.name.trim());
  if (!items.length) return;
  const slot = S.sheet.slot;
  if (r.replaceIds) { const L = S.logs[vday()]; L.items = L.items.filter(i => !r.replaceIds.includes(i.id)); }
  addItems(items.map(i => ({...i, slot})));
  if (r.save && items.length) rememberMeal(r, items, slot);
  showToast(`${r.replaceIds ? 'Updated' : 'Added to'} ${slot} · ${sumItems(items).kcal} kcal${r.save && !r.replaceIds ? ' · saved' : ''}`);
  closeSheet();
}

// "My meals": reusable combinations, most used first for each meal slot.
function rememberMeal(r, items, slot){
  const meals = S.profile.savedMeals || [];
  const name = (r.name || items.map(i => i.name).slice(0, 2).join(' & ')).trim().slice(0, 40);
  const sig = items.map(i => i.name.toLowerCase()).sort().join('|');
  let m = meals.find(x => x.id === r.savedId) || meals.find(x => x.items.map(i => i.name.toLowerCase()).sort().join('|') === sig);
  if (!m) { m = { id:uid(), uses:0, slots:{} }; meals.unshift(m); }
  Object.assign(m, { name, items: items.map(cleanItem), last: Date.now(), uses: (m.uses || 0) + 1 });
  m.slots[slot] = (m.slots[slot] || 0) + 1;
  S.profile.savedMeals = meals.slice(0, 40); save.profile();
}
function savedFor(slot){
  return [...(S.profile.savedMeals || [])].sort((a, b) => ((b.slots?.[slot] || 0) - (a.slots?.[slot] || 0)) || (b.last - a.last));
}
function useSaved(id){
  const m = (S.profile.savedMeals || []).find(x => x.id === id); if (!m) return;
  S.logResult = { review: m.items.map(i => ({...i})), name: m.name, savedId: m.id, save: true, feedback: null };
  render();
}
function forgetSaved(id){
  const before = S.profile.savedMeals || [], gone = before.find(x => x.id === id);
  S.profile.savedMeals = before.filter(x => x.id !== id); save.profile();
  if (gone) showToast(`Removed ${gone.name}`, () => { S.profile.savedMeals = before; save.profile(); });
  render();
}
// Re-open a logged meal in the editor; saving replaces those items.
function editMeal(slot){
  const its = (S.logs[vday()]?.items || []).filter(i => i.slot === slot);
  openSheet(slot);
  S.logResult = { review: its.map(cleanItem), replaceIds: its.map(i => i.id), name: '', save: false, feedback: null };
  render();
}
// Add a forgotten item to the review: estimated by the AI, or blank to fill in.
async function addToReview(text){
  text = text.trim(); const r = S.logResult; if (!r) return;
  if (!text) { r.review.push(cleanItem({ name:'', kcal:0 })); r.editing = r.review.length - 1; render(); return; }
  S.busy.addItem = true; render();
  try {
    const out = await S.sample.json(PROMPTS.food({ text, slot:S.sheet.slot, country:S.profile.data.shopping?.country, eaten:{}, targets:null, hasPhoto:false, clarification:'use a typical portion' }), { modelTier:'quick' });
    (Array.isArray(out?.items) ? out.items : []).forEach(i => r.review.push(cleanItem(i)));
    S.draft.more = ''; r.adding = false;
  } catch (e) { hardFail(e); S.err.log = errText(e); }
  S.busy.addItem = false; render();
}
function openSheet(slot){ S.sheet = { slot, enter:true }; S.logSlot = slot; S.logResult = null; S.err.log = null; document.body.classList.add('sheet-open'); render(); S.sheet.enter = false; setTimeout(() => $('#logText')?.focus(), 250); }
function closeSheet(){ S.sheet = null; S.logResult = null; S.err.log = null; S.draft.log = ''; S.logPhoto = null; document.body.classList.remove('sheet-open'); render(); }
let toastTimer;
function showToast(text, undo){ S.toast = text; S.toastUndo = undo || null; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; S.toastUndo = null; render(); }, undo ? 5000 : 2600); }

// Show another day on Today; its food log loads from the device, then the account.
async function gotoDay(k){
  const today = dkey(); if (k > today) k = today;
  S.day = k === today ? null : k; S.openMeal = null;
  if (!S.logs[k]) S.logs[k] = Store.local('log-' + k) || { items:[] };
  render(); window.scrollTo(0, 0);
  const v = await Store.remote('log-' + k);
  if (v && vday() === k) { S.logs[k] = v; render(); }
}
function shiftDay(n){ const d = fromKey(vday()); d.setDate(d.getDate() + n); gotoDay(dkey(d)); }

async function generatePlan(){

// Build the shopping list and prep schedule from the current week plan, for one supermarket.
async function generateShopping(store){
  if (!S.plan?.days || S.busy.shop) return;
  if (!S.sampleOK) { S.err.shop = 'Sign in to create your shopping list.'; render(); return; }
  store = store || S.plan.store || storeOptions()[0] || '';

async function loadRecipe(key, meal){
  if (S.plan.recipes?.[key]) { render(); return; }
  if (!S.sampleOK) { S.err.plan = 'Sign in to see recipes.'; render(); return; }
  S.busy.recipe = key; S.openRecipe = key; render();

    S.plan.recipes = S.plan.recipes || {}; S.plan.recipes[key] = r; save.plan();

}

// Dish photos from Pexels via /api/photo. Fetched once per meal for the day
// being viewed, then saved inside the plan so they never load twice.
const photoBusy = new Set();
async function loadDayPhotos(di){
  if (S.photosOff || !window.FORKCAST_CONFIG?.photoUrl || !S.plan?.days?.[di]) return;
  S.plan.photos = S.plan.photos || {};
  const todo = S.plan.days[di].meals.map((m, j) => [di + '-' + j, m]).filter(([k]) => !(k in S.plan.photos) && !photoBusy.has(k));
  if (!todo.length) return;
  const token = await Auth.token(); if (!token) return;
  todo.forEach(([k]) => photoBusy.add(k));
  let changed = false;
  await Promise.all(todo.map(async ([k, m]) => {
    try {
      const res = await fetch(window.FORKCAST_CONFIG.photoUrl + '?q=' + encodeURIComponent(m.photo || m.name), { headers:{ Authorization:'Bearer ' + token } });
      const body = await res.json().catch(() => ({}));
      if (res.ok && body.src) { S.plan.photos[k] = body; changed = true; }
      else if (body.code === 'not_found') { S.plan.photos[k] = null; changed = true; }
      else if (body.code === 'not_configured') S.photosOff = true;
    } catch {}
    photoBusy.delete(k);
  }));
  if (changed) { save.plan(); if (S.view === 'plan') render(); }
}

// === services/onboarding.js ===
// Onboarding flow: open, move between steps, save, finish, and the one AI review.
function startOnboarding(edit){
  S.ob = { step:0, data: JSON.parse(JSON.stringify(S.profile.data || {})), edit: !!edit };
  S.obDone = false; window.scrollTo(0, 0); render();
}
function obSave(){ S.profile.data = JSON.parse(JSON.stringify(S.ob.data)); save.profile(); }
function obNext(skip){
  const st = OB_STEPS[S.ob.step];
  if (st.required && obMissing().length) { S.ob.tried = true; render(); return; }
  obSave();
  if (S.ob.step < OB_STEPS.length - 1) { S.ob.step++; S.ob.tried = false; window.scrollTo(0, 0); render(); return; }
  finishOnboarding();
}
function obBack(){ if (S.ob.step > 0) { obSave(); S.ob.step--; window.scrollTo(0, 0); render(); } }

async function finishOnboarding(){
  obSave();
  if (!S.profile.onboarded) { S.profile.onboarded = true; S.profile.onboardedAt = dkey(); }
  S.profile.targets = null;            // use the fresh on-device estimate until the review says otherwise
  S.obDone = true; S.ob.review = null; save.profile(); window.scrollTo(0, 0); render();
  if (!S.sampleOK) { S.ob.review = { error:'Sign in to get your dietitian\'s notes.' }; render(); return; }
  const t = targets();
  try {
    const r = await S.sample.json(PROMPTS.onboardingReview(S.profile.data, t && { kcal:t.kcal, protein:t.protein, carbs:t.carbs, fat:t.fat, fiber:t.fiber }), { modelTier:'default' });
    if (isObj(r?.targets) && r.targets.kcal) { S.profile.targets = { kcal:r0(r.targets.kcal), protein:r0(r.targets.protein), carbs:r0(r.targets.carbs), fat:r0(r.targets.fat), fiber:r0(r.targets.fiber) }; S.profile.targetsSource = 'coach'; }
    if (isObj(r?.focus) && r.focus.weak_point) S.profile.focus = { weak_point:String(r.focus.weak_point), why:String(r.focus.why || ''), tips:(Array.isArray(r.focus.tips) ? r.focus.tips : []).slice(0,5).map(String), at:dkey() };
    if (r?.medical_flag) S.profile.flags = [...new Set([...(S.profile.flags || []), String(r.medical_flag)])].slice(-5);
    const summary = String(r?.summary || '').trim();
    if (S.ob) S.ob.review = { summary, flag: r?.medical_flag || null };
    // The review also opens today's conversation in the Dietitian tab.
    if (summary) {
      S.chat.start = S.chat.turns.length;
      S.chat.turns.push({ role:'assistant', content:summary, quick:(Array.isArray(r.quick_replies) ? r.quick_replies : []).slice(0,4).map(String), flag:r?.medical_flag || null, at:Date.now() });
      save.chat();
    }
    save.profile();
  } catch (e) { hardFail(e); if (S.ob) S.ob.review = { error: errText(e) }; }
  render();
}
function closeOnboarding(){ S.ob = null; S.obDone = false; S.view = 'today'; window.scrollTo(0, 0); render(); }

// === views/shell.js ===
// Top-level render: sign-in gate, nav tabs, current view, shared banners
function render(){
  const authed = S.auth.status === 'signed-in';
  document.body.classList.toggle('signed-out', !authed);
  if (S.view !== 'coach' && S.aboutOpen) { S.aboutOpen = null; document.body.classList.remove('sheet-open'); }
  if (!authed) { $('#tabs').innerHTML = ''; $('#view').innerHTML = vAuth(); restoreAuthDraft(); return; }
  document.body.classList.toggle('onboarding', !!S.ob);
  if (S.ob) { $('#tabs').innerHTML = ''; $('#view').innerHTML = S.obDone ? vObDone() : vOnboarding(); return; }
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" data-act="nav" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${ICONS[k]}<span>${l}</span></button>`).join('');
  $('#railFoot').innerHTML = `<span class="muted">${esc(S.auth.email || '')}</span><button class="btn ghost small" data-act="signout">Sign out</button>`;
  if (S.view === 'coach' && !S.busy.chat) maybeNewSession();
  const v = { today:vToday, coach:vCoach, plan:vPlan, shop:vShop, progress:vProgress }[S.view]();
  const view = $('#view');
  if (render.last !== S.view) { render.last = S.view; view.classList.add('entering'); clearTimeout(render.t); render.t = setTimeout(() => view.classList.remove('entering'), 400); }
  view.innerHTML = v + (S.toast ? `<div class="toast" role="status"><span>${esc(S.toast)}</span>${S.toastUndo ? '<button data-act="undo">Undo</button>' : ''}</div>` : '');
  if (S.view === 'coach') scrollChat();
  const lt = $('#logText'); if (lt) lt.value = S.draft.log;
  const ct = $('#chatText'); if (ct) { ct.value = S.draft.chat; fitChatBox(); }
  document.body.classList.toggle('on-coach', S.view === 'coach');
  if (S.view === 'plan') keepDayInView();
  if (S.view !== 'progress' && S.ckSheet) { S.ckSheet = null; document.body.classList.remove('sheet-open'); }
  if (S.view !== 'shop' && S.storeSheet) { S.storeSheet = null; document.body.classList.remove('sheet-open'); }
  if (S.view !== 'plan' && S.planSheet) { S.planSheet = null; document.body.classList.remove('sheet-open'); }
  if (S.view === 'plan' && S.plan?.days) loadDayPhotos(Math.min(S.planDay, S.plan.days.length - 1));
  const at = $('#askText'); if (at) at.value = S.draft.ask;
}

// Today: calorie ring, macros, focus tips, food logging, streak
function vToday(){
  const day = vday(), isToday = day === dkey(), t = targets(), log = S.logs[day] || {items:[]}, eaten = sumItems(log.items);
  const kcalT = t?.kcal || 0, left = kcalT - eaten.kcal, pct = kcalT ? Math.min(eaten.kcal / kcalT, 1) : 0;

  const overdue = S.profile.onboarded && (() => { const last = S.progress.checkins.slice(-1)[0]?.date || S.profile.onboardedAt; return last && daysBetween(last, dkey()) >= 7; })();

  return `
  <div class="head"><div><div class="label">${fromKey(day).toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'})}</div><h1>${isToday ? (eaten.kcal ? 'Today\'s fuel' : 'What\'s on the plate today?') : fromKey(day).toLocaleDateString(undefined,{weekday:'long'}) + '\'s food'}</h1></div>
